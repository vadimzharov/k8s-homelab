apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: nginx-certificates-management
  namespace: argocd
spec:
  generators:
  - matrix:
      generators:
        - clusters:
            selector:
              matchLabels:
                nginx: "installed"
                nginx-certs: "generate" 
        - plugin:
            configMapRef:
              name: argocd-secrets-plugin
            input:
              parameters:
                secretName: "k8s-clusters-infra-secrets"  
  template:
    metadata:
      name: '{{name}}-nginx-certs-generate'
    spec:
      project: k8s-homelab-cluster
      sources:
      - helm:
          releaseName: wildcard
          values: |
            controllers: 
              main:
               enabled: false
            rawResources:
              apps-certificate:
                apiVersion: cert-manager.io/v1
                kind: Certificate
                spec:
                  spec:
                    secretName: wildcard-apps-certificate
                    renewBefore: 240h0m0s
                    dnsNames:
                    - '{{ wildcarddnsname }}'
                    issuerRef:
                      name: cm-config-clusterissuer
                      kind: ClusterIssuer
        repoURL: https://bjw-s-labs.github.io/helm-charts
        chart: app-template
        targetRevision: 3.4.0
      destination:
        server: '{{server}}'
        namespace: ingress-nginx
      syncPolicy:
        automated:
          prune: true
          selfHeal: true

          