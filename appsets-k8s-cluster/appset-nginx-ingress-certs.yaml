apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: nginx-certificates
  namespace: argocd
spec:
  generators:
  - clusters:
      selector:
        matchLabels:
          nginx: "installed"
          nginx-certs: "read"
      values:
        revision: '{{metadata.annotations.branch-name}}' 
        certs: 'read'
  template:
    metadata:
      name: '{{name}}-nginx-certs'
    spec:
      project: k8s-homelab-cluster
      sources:
      - repoURL: git@github.com:vadimzharov/k8s-homelab
        path: k8s-cluster/ingress-certs-{{values.certs}}
        targetRevision: '{{values.revision}}'
      destination:
        server: '{{server}}'
        namespace: ingress-nginx
      syncPolicy:
        automated:
          prune: true
          selfHeal: true

          