apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cilium-gw
  namespace: argocd
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  cilium-gw: "installed"
          - plugin:
              configMapRef:
                name: argocd-secrets-plugin
              input:
                parameters:
                  secretName: "{{ name }}-cni-secrets"
  template:
    metadata:
      name: '{{ name }}-cilium-gw' 
    spec:
      project: k8s-homelab-cluster
      sources:
      - helm:
          releaseName: cilium-gw
          values: |
            debug:
              enabled: false
            securityContext:
              privileged: true              
            bgpControlPlane:
              enabled: true
            operator:
              replicas: 1
            prometheus:
              enabled: true
            bpf:
              masquerade: true
            # Kept as a secondary safety net - see MTU override below for the
            # actual fix. This ConfigMap-level setting affects host-level
            # sysctls Cilium manages; verified via tcpdump that it does NOT
            # propagate into individual pod network namespaces, so it alone
            # didn't fix the issue described below.
            pmtuDiscovery:
              enabled: true
              packetizationLayerPMTUDMode: "always"
            # Root fix for multi-second TLS handshake stalls on pod egress to
            # other nodes/clusters. tcpdump during a stalled handshake showed
            # ~1398-1399 byte TCP segments (the TLS ClientHello) silently
            # dropped and retried for ~6.3s via slow kernel black-hole
            # detection, until the segment shrank to 1024 bytes and succeeded
            # instantly - textbook PMTU black hole. 1398 is right at
            # 1500 (physical MTU) - 50 (VXLAN overhead) - ~52 (inner IP/TCP
            # headers w/ timestamps): routing-mode is "tunnel"/vxlan (see
            # cilium-config) but pod MTU was left at the chart's auto-detect
            # default (1500, i.e. not reduced for the encapsulation
            # overhead). Setting MTU explicitly below 1500 minus overhead
            # means pods never generate a segment that can hit this black
            # hole in the first place, independent of PMTUD/probing settings.
            MTU: 1450
            tls:
              ca:
                cert: {{ cilium-ca }}
                key: {{ cilium-ca-key }}     
            cluster:
              id: {{ cilium-clusterid }}
              name: {{ cilium-clustername }}
            clustermesh:
              apiserver:
                service:
                  type: NodePort
                  nodePort: {{ mesh-api-port }}
                nodeSelector:
                  node-role.kubernetes.io/control-plane: ""
                tls:
                  authMode: cluster
                  server:
                    extraDnsNames:
                      - "*.{{ mesh-domain }}"
                      - "*.k8s03.{{ mesh-domain }}"
                      - "*.k8s03.{{ mesh-domain }}"
                      - "*.k8s04.{{ mesh-domain }}"
              config:
                enabled: false
                domain: "{{ mesh-domain }}"
                clusters:
                  - name: {{ mesh-peer-cluster1name }}
                    address: {{ mesh-peer-cluster1address }}
                    port:  {{ mesh-peer-cluster1port }}
                  #- name: {{ mesh-peer-cluster2name }}
                  #  address: {{ mesh-peer-cluster2address }}
                  #  port:  {{ mesh-peer-cluster2port }}                    
              useAPIServer: false
            ipv4:
              enabled: true
            nodePort:
              enabled: true
            egressGateway:
              enabled: true
            gatewayAPI:
              enabled: true
              gatewayClass:
                create: "false"
            ipam:
              mode: "cluster-pool"
              operator:
                clusterPoolIPv4PodCIDRList: 
                  - {{ cilium-podcidr }}
                clusterPoolIPv4MaskSize: 24
            l7Proxy: true  
            kubeProxyReplacement: true
            k8sServiceHost: {{ k8s-servicehost }}
            k8sServicePort: 6443          
            cgroup:
              autoMount:
                enabled: false
              hostRoot: /sys/fs/cgroup
            hubble:
              metrics:
                enabled: 
                - dns:query;ignoreAAAA
                - drop
                - tcp
                - flow
                - icmp
                - http            
              relay: 
                enabled: true
              ui:
                enabled: true
                ingress:
                  enabled: true
                  annotations:
                    k8s-dashboard-group: Dashboards
                    k8s-dashboard-appname: "{{name}} - Cilium Hubble UI"
                  hosts:
                    - hubble-ui-{{ name }}.apps.{{ mesh-domain }}                
              tls:
                auto:
                  enabled: true 
                  method: helm  
                  certValidityDuration: 1095
        repoURL: https://helm.cilium.io/
        chart: cilium
        targetRevision: '{{metadata.labels.cilium-version}}'
      - repoURL: https://github.com/kubernetes-sigs/gateway-api.git
        targetRevision: 'v1.4.1'
        path: config/crd/standard
      #- repoURL: https://github.com/kubernetes-sigs/gateway-api.git
      #  targetRevision: 'v1.2.0'
      #  path: config/crd/experimental/
      #  include: 'gateway.networking.k8s.io_tlsroutes.yaml'
      destination:
        server: '{{server}}'
        namespace: kube-system
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          