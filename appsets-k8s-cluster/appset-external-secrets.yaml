apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: external-secrets
  namespace: argocd
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
  - clusters:
      selector:
        matchLabels:
          external-secrets: "installed"
  template:
    metadata:
      name: '{{name}}-external-secrets' 
    spec:
      project: k8s-homelab-cluster
      sources:
      - helm:
          values: |
            installCRD: true
            serviceAccount:
              name: external-secrets-sa
          parameters:
            - name: installCRDs
              value: "true" 
        repoURL: https://charts.external-secrets.io
        chart: external-secrets
        targetRevision: 0.10.4
      destination:
        server: '{{server}}'
        namespace: external-secrets
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          