apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: k8s-mcp
  namespace: argocd
  annotations:
    appset-dashboard-appname: "K8S MCP server (in-cluster)"
    appset-dashboard-groupname: "AI tools"
    k8s-dashboard-group: "AI tools"
    k8s-dashboard-appname: "K8S MCP server (in-cluster)"
spec:
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  k8s-mcp: "installed"
          - plugin:
              configMapRef:
                name: argocd-secrets-plugin
              input:
                parameters:
                  secretName: "k8s-clusters-apps-secrets"
  template:
    metadata:
      name: '{{name}}-k8s-mcp'
    spec:
      project: k8s-homelab-apps
      sources:
      - helm:
          releaseName: k8s-mcp
          values: |
            serviceAccount:
              create: true
              automountToken: true
            # No RBAC declared here anymore - passthrough mode means this
            # server's own identity is never used for API calls, only
            # whatever token the caller forwards. The permission set callers
            # actually get now lives with the caller (k8s-agent's own
            # rbac.clusterRole below), not here. See kubernetes-agent#15.
            # OAuth passthrough: forwards the caller's own Authorization
            # bearer token to the K8s API instead of using a fixed identity,
            # so RBAC is enforced per-caller rather than by a blanket
            # --read-only flag. Validated via manual helm testing (temporary
            # k8s-mcp-passthrough-test namespace) before this rollout - see
            # kubernetes-agent#13.
            config:
              require_oauth: true
              skip_jwt_verification: true
              cluster_auth_mode: passthrough
            extraArgs:
              - --cluster-provider
              - in-cluster
            ingress:
              enabled: false
            httpRoute:
              enabled: false
        repoURL: oci://ghcr.io/containers/charts/kubernetes-mcp-server
        targetRevision: 0.1.0
        path: .
      # Standalone custom A2A agent (github.com/vadimzharov/kubernetes-agent)
      # replacing kagent's per-cluster k8s-agent-litellm Agent, bundled into
      # this same Application since it only ever makes sense alongside its
      # own cluster's kubernetes-mcp-server above - see
      # k8s-ai-homelab docs/20 for the full migration rationale.
      - helm:
          releaseName: k8s-agent
          values: |
            litellm:
              baseUrl: "https://litellm.{{ domainname }}/v1"
              model: "qwen3.6-27b"
              # Same Vault-backed token kagent used for its own ModelConfig
              # (litellm-creds/PROVIDER_API_KEY in appset-kagent.yaml) -
              # reused here per explicit instruction, not a fresh key.
              apiKeySecretRef:
                name: k8s-agent-litellm
                key: api-key
            k8sMcp:
              url: "http://k8s-mcp-kubernetes-mcp-server.k8s-mcp.svc.cluster.local:8080/mcp"
              # Forwards this pod's own mounted SA token to k8s-mcp as the
              # Authorization bearer header - the identity that rbac.clusterRole
              # below grants permissions to. Requires chart >=0.0.12
              # (kubernetes-agent#13).
              forwardServiceAccountToken: true
            # This agent's own permission scope against k8s-mcp - moved here
            # from k8s-mcp's rbac.extraClusterRoles (a hardcoded, cross-chart
            # subject reference) now that the chart can bind RBAC to its own
            # ServiceAccount directly. Same rule set as before, unchanged in
            # effect - just declared where it belongs. Requires chart
            # >=0.0.13 (kubernetes-agent#15).
            rbac:
              clusterRole:
                rules:
                  - apiGroups: [""]
                    resources:
                      - pods
                      - pods/log
                      - nodes
                      - events
                      - namespaces
                      - services
                      - configmaps
                      - endpoints
                      - persistentvolumes
                      - persistentvolumeclaims
                      - replicationcontrollers
                      - resourcequotas
                      - serviceaccounts
                    verbs: ["get", "list", "watch"]
                  - apiGroups: ["apps"]
                    resources:
                      - deployments
                      - statefulsets
                      - daemonsets
                      - replicasets
                    verbs: ["get", "list", "watch"]
                  - apiGroups: ["metrics.k8s.io"]
                    resources:
                      - nodes
                      - pods
                    verbs: ["get", "list"]
                  # nodes_stats_summary hits the kubelet's stats/summary
                  # endpoint via the API server's node proxy - needs this
                  # subresource explicitly, plain "nodes" get/list/watch
                  # above doesn't cover it. Discovered via a live 403
                  # ("Permission denied - check RBAC permissions for
                  # nodes_stats_summary") the same way nodes_top's
                  # metrics.k8s.io requirement was found for k8s-hub-mcp
                  # (see docs/16).
                  - apiGroups: [""]
                    resources:
                      - nodes/proxy
                      - nodes/stats
                    verbs: ["get"]
                  - apiGroups: ["batch"]
                    resources: ["jobs", "cronjobs"]
                    verbs: ["get", "list", "watch"]
                  - apiGroups: ["networking.k8s.io"]
                    resources: ["ingresses", "networkpolicies"]
                    verbs: ["get", "list", "watch"]
                  # Added 2026-08-28 - a live security-audit request showed
                  # every resources_list call for Role/RoleBinding/
                  # ClusterRole/ClusterRoleBinding failing 100% of the time
                  # on both k8s02-agent and hub-agent, confirmed via
                  # `kubectl auth can-i list clusterroles --as=...` -> no.
                  # RBAC visibility is fundamental to a security review, so
                  # this was the main blocker. See k8s-ai-homelab docs/20.
                  - apiGroups: ["rbac.authorization.k8s.io"]
                    resources:
                      - roles
                      - rolebindings
                      - clusterroles
                      - clusterrolebindings
                    verbs: ["get", "list", "watch"]
            agent:
              clusterName: "{{name}}"
            # Shared bearer token, same value LiteLLM sends via static_headers
            # on every call to this and the other two agents (prometheus-agent,
            # argocd-agent) - see appset-litellm.yaml. Requires chart >=0.0.10
            # (kubernetes-agent#9). One token for all agent communication, not
            # per-agent - simpler secret management, matches the ask.
            authToken:
              value: "{{agents-comm-token}}"
            # Exposed via HTTPRoute on every cluster (not just k8s01, which
            # strictly needs it since it can't be co-located with LiteLLM) -
            # a deliberate unified approach rather than branching per
            # cluster. Distinct host per cluster via {{name}} - never a
            # shared hostname across instances (that was kagent's
            # a2aBaseUrl bug class).
            route:
              enabled: true
              host: "k8s-agent-{{name}}.{{ domainname }}"
              parentRefs:
                - name: cilium-gw
                  namespace: cilium-system
                  sectionName: https-gw
              annotations:
                k8s-dashboard-group: AI tools
                k8s-dashboard-appname: "K8S Agent ({{name}})"
        repoURL: oci://ghcr.io/vadimzharov/charts/k8s-agent
        targetRevision: 0.0.13
        path: .
      - helm:
          releaseName: k8s-agent-secrets
          values: |
            controllers:
              main:
                enabled: false
            rawResources:
              k8s-agent-litellm:
                apiVersion: v1
                kind: Secret
                forceRename: "k8s-agent-litellm"
                spec:
                  stringData:
                    api-key: {{litellm-kagent-key}}
        repoURL: https://bjw-s-labs.github.io/helm-charts
        chart: app-template
        targetRevision: 4.6.2
      destination:
        server: '{{server}}'
        namespace: k8s-mcp
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
