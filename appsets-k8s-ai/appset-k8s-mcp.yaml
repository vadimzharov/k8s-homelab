apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: k8s-mcp
  namespace: argocd
  annotations:
    appset-dashboard-appname: "K8S MCP server (in-cluster)"
    appset-dashboard-groupname: "AI tools"
    k8s-dashboard-group: "AI tools"
    k8s-dashboard-appname: "K8S MCP server (in-cluster)"
spec:
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  k8s-mcp: "installed"
          - plugin:
              configMapRef:
                name: argocd-secrets-plugin
              input:
                parameters:
                  secretName: "k8s-clusters-apps-secrets"
  template:
    metadata:
      name: '{{name}}-k8s-mcp'
    spec:
      project: k8s-homelab-apps
      sources:
      - helm:
          releaseName: k8s-mcp
          values: |
            serviceAccount:
              create: true
              automountToken: true
            rbac:
              create: true
              extraClusterRoles:
                - name: reader
                  rules:
                    - apiGroups: [""]
                      resources:
                        - pods
                        - pods/log
                        - nodes
                        - events
                        - namespaces
                        - services
                        - configmaps
                        - endpoints
                        - persistentvolumes
                        - persistentvolumeclaims
                        - replicationcontrollers
                        - resourcequotas
                        - serviceaccounts
                      verbs: ["get", "list", "watch"]
                    - apiGroups: ["apps"]
                      resources:
                        - deployments
                        - statefulsets
                        - daemonsets
                        - replicasets
                      verbs: ["get", "list", "watch"]
                    - apiGroups: ["metrics.k8s.io"]
                      resources:
                        - nodes
                        - pods
                      verbs: ["get", "list"]
                    # nodes_stats_summary hits the kubelet's stats/summary
                    # endpoint via the API server's node proxy - needs this
                    # subresource explicitly, plain "nodes" get/list/watch
                    # above doesn't cover it. Discovered via a live 403
                    # ("Permission denied - check RBAC permissions for
                    # nodes_stats_summary") the same way nodes_top's
                    # metrics.k8s.io requirement was found for k8s-hub-mcp
                    # (see docs/16).
                    - apiGroups: [""]
                      resources:
                        - nodes/proxy
                        - nodes/stats
                      verbs: ["get"]
                    - apiGroups: ["batch"]
                      resources: ["jobs", "cronjobs"]
                      verbs: ["get", "list", "watch"]
                    - apiGroups: ["networking.k8s.io"]
                      resources: ["ingresses", "networkpolicies"]
                      verbs: ["get", "list", "watch"]
                    # Added 2026-08-28 - a live security-audit request showed
                    # every resources_list call for Role/RoleBinding/
                    # ClusterRole/ClusterRoleBinding failing 100% of the time
                    # on both k8s02-agent and hub-agent, confirmed via
                    # `kubectl auth can-i list clusterroles --as=...` -> no.
                    # RBAC visibility is fundamental to a security review, so
                    # this was the main blocker. See k8s-ai-homelab docs/20.
                    - apiGroups: ["rbac.authorization.k8s.io"]
                      resources:
                        - roles
                        - rolebindings
                        - clusterroles
                        - clusterrolebindings
                      verbs: ["get", "list", "watch"]
              extraClusterRoleBindings:
                - name: reader
                  roleRef:
                    name: reader
            extraArgs:
              - --cluster-provider
              - in-cluster
              - --read-only
            ingress:
              enabled: false
            httpRoute:
              enabled: false
        repoURL: oci://ghcr.io/containers/charts/kubernetes-mcp-server
        targetRevision: 0.1.0
        path: .
      # Standalone custom A2A agent (github.com/vadimzharov/kubernetes-agent)
      # replacing kagent's per-cluster k8s-agent-litellm Agent, bundled into
      # this same Application since it only ever makes sense alongside its
      # own cluster's kubernetes-mcp-server above - see
      # k8s-ai-homelab docs/20 for the full migration rationale.
      - helm:
          releaseName: k8s-agent
          values: |
            litellm:
              baseUrl: "https://litellm.{{ domainname }}/v1"
              model: "qwen3.6-27b"
              # Same Vault-backed token kagent used for its own ModelConfig
              # (litellm-creds/PROVIDER_API_KEY in appset-kagent.yaml) -
              # reused here per explicit instruction, not a fresh key.
              apiKeySecretRef:
                name: k8s-agent-litellm
                key: api-key
            k8sMcp:
              url: "http://k8s-mcp-kubernetes-mcp-server.k8s-mcp.svc.cluster.local:8080/mcp"
            agent:
              clusterName: "{{name}}"
            # Exposed via HTTPRoute on every cluster (not just k8s01, which
            # strictly needs it since it can't be co-located with LiteLLM) -
            # a deliberate unified approach rather than branching per
            # cluster. Distinct host per cluster via {{name}} - never a
            # shared hostname across instances (that was kagent's
            # a2aBaseUrl bug class).
            route:
              enabled: true
              host: "k8s-agent-{{name}}.{{ domainname }}"
              parentRefs:
                - name: cilium-gw
                  namespace: cilium-system
                  sectionName: https-gw
        repoURL: oci://ghcr.io/vadimzharov/charts/k8s-agent
        targetRevision: 0.0.8
        path: .
      - helm:
          releaseName: k8s-agent-secrets
          values: |
            controllers:
              main:
                enabled: false
            rawResources:
              k8s-agent-litellm:
                apiVersion: v1
                kind: Secret
                forceRename: "k8s-agent-litellm"
                spec:
                  stringData:
                    api-key: {{litellm-kagent-key}}
        repoURL: https://bjw-s-labs.github.io/helm-charts
        chart: app-template
        targetRevision: 4.6.2
      destination:
        server: '{{server}}'
        namespace: k8s-mcp
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
