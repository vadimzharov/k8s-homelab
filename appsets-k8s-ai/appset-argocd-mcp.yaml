apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: argocd-mcp
  namespace: argocd
  annotations:
    appset-dashboard-appname: "ArgoCD MCP Server"
    appset-dashboard-groupname: "AI tools"
spec:
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  argocd-mcp: "installed"
          - plugin:
              configMapRef:
                name: argocd-secrets-plugin
              input:
                parameters:
                  secretName: "k8s-clusters-apps-secrets"
  template:
    metadata:
      name: '{{name}}-argocd-mcp'
    spec:
      project: k8s-homelab-apps
      sources:
      - helm:
          releaseName: argocd-mcp
          values: |
            controllers:
              main:
                type: deployment
                containers:
                  main:
                    image:
                      repository: ghcr.io/argoproj-labs/mcp-for-argocd
                      tag: main
                    env:
                      ARGOCD_BASE_URL:
                        value: "https://argocd.{{ domainname }}"
                      ARGOCD_API_TOKEN:
                        value: "{{ argocd-api-token }}"
                      # Caps what any caller (including argocd-agent) can
                      # do at the server level, independent of prompt
                      # wording - the mutating tools (sync_application,
                      # create_application, delete_application,
                      # run_resource_action) were reachable without this.
                      # See k8s-ai-homelab docs/21.
                      MCP_READ_ONLY:
                        value: "true"
                    # Was a top-level `resources:` key (sibling of controllers/service) -
                    # not a valid location in this chart's schema, so it was silently
                    # ignored (no error) and the container ran with no request/limit at
                    # all (confirmed live: QoS: BestEffort). Moved here, under the
                    # container itself, matching apps-palette-mcp.yaml and
                    # appset-ik-llama-qwen3-6-27b.yaml.
                    resources:
                      requests:
                        cpu: 50m
                        memory: 64Mi
                      limits:
                        cpu: 500m
                        memory: 256Mi
            service:
              main:
                primary: true
                enabled: true
                controller: main
                ports:
                  http:
                    port: 3000
        repoURL: https://bjw-s-labs.github.io/helm-charts
        chart: app-template
        targetRevision: 4.6.2
      # Standalone A2A agent (github.com/vadimzharov/argocd-agent)
      # replacing kagent's hub-argocd-agent - see k8s-ai-homelab docs/21.
      # Co-located with argocd-mcp above and with LiteLLM (both on k8s02)
      # - no HTTPRoute needed, same reasoning as prometheus-agent.
      - helm:
          releaseName: argocd-agent
          values: |
            litellm:
              baseUrl: "https://litellm.{{ domainname }}/v1"
              model: "qwen3.6-27b"
              # Inline key - the chart creates its own Secret from this
              # value directly, no separate bjw-s rawResources source
              # needed (unlike k8s-agent's setup). Same Vault-backed
              # token kagent used for its own ModelConfig.
              apiKey: {{litellm-kagent-key}}
            argocdMcp:
              url: "http://argocd-mcp.argocd-mcp.svc.cluster.local:3000/mcp"
            # Shared bearer token - see appset-k8s-mcp.yaml for the full
            # rationale (same token across all agent communication).
            authToken:
              value: "{{agents-comm-token}}"
        repoURL: oci://ghcr.io/vadimzharov/charts/argocd-agent
        targetRevision: 0.0.11
        path: .
      destination:
        server: '{{server}}'
        namespace: argocd-mcp
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
