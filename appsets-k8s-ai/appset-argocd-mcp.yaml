apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: argocd-mcp
  namespace: argocd
  annotations:
    appset-dashboard-appname: "ArgoCD MCP Server"
    appset-dashboard-groupname: "AI tools"
spec:
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  argocd-mcp: "installed"
          - plugin:
              configMapRef:
                name: argocd-secrets-plugin
              input:
                parameters:
                  secretName: "k8s-clusters-apps-secrets"
  template:
    metadata:
      name: '{{name}}-argocd-mcp'
    spec:
      project: k8s-homelab-apps
      sources:
      - helm:
          releaseName: argocd-mcp
          values: |
            controllers:
              main:
                type: deployment
                containers:
                  main:
                    image:
                      repository: ghcr.io/argoproj-labs/mcp-for-argocd
                      tag: main
                    env:
                      ARGOCD_BASE_URL:
                        value: "https://argocd.{{ domainname }}"
                      ARGOCD_API_TOKEN:
                        value: "{{ argocd-api-token }}"
                      # Caps what any caller (including argocd-agent) can
                      # do at the server level, independent of prompt
                      # wording - the mutating tools (sync_application,
                      # create_application, delete_application,
                      # run_resource_action) were reachable without this.
                      # See k8s-ai-homelab docs/21.
                      MCP_READ_ONLY:
                        value: "true"
                    # Was a top-level `resources:` key (sibling of controllers/service) -
                    # not a valid location in this chart's schema, so it was silently
                    # ignored (no error) and the container ran with no request/limit at
                    # all (confirmed live: QoS: BestEffort). Moved here, under the
                    # container itself, matching apps-palette-mcp.yaml and
                    # appset-ik-llama-qwen3-6-27b.yaml.
                    resources:
                      requests:
                        cpu: 50m
                        memory: 64Mi
                      limits:
                        cpu: 500m
                        memory: 256Mi
            service:
              main:
                primary: true
                enabled: true
                controller: main
                ports:
                  http:
                    port: 3000
        repoURL: https://bjw-s-labs.github.io/helm-charts
        chart: app-template
        targetRevision: 4.6.2
      destination:
        server: '{{server}}'
        namespace: argocd-mcp
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
