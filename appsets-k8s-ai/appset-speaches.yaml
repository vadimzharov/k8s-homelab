apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: speaches
  namespace: argocd
  annotations:
    ai-agent-inventory-appname: "Speaches (STT)"
    appset-dashboard-appname: "Speaches (STT)"
    appset-dashboard-groupname: "AI tools"
spec:
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  speaches: "installed"
          - plugin:
              configMapRef:
                name: argocd-secrets-plugin
              input:
                parameters:
                  secretName: "k8s-clusters-apps-secrets"
  template:
    metadata:
      name: '{{name}}-speaches'
    spec:
      project: k8s-homelab-apps
      sources:
      - helm:
          releaseName: speaches
          values: |
            # Speaches: OpenAI-compatible speech-to-text (faster-whisper), CPU
            # only. Backs LiteLLM's "robot-stt" model (see appset-litellm.yaml)
            # for the voice assistant robot, so audio stays in the house.
            #
            # No API key and no HTTPRoute: only reachable in-cluster, and the
            # only client is LiteLLM, which does its own virtual-key auth -
            # same setup as ik-llama and Ollama.
            controllers:
              main:
                type: deployment
                # RWO model cache PVC - avoid two pods fighting over it on rollout.
                strategy: Recreate
                pod:
                  # Image runs as ubuntu (uid 1000); the Synology CSI volume is
                  # root-owned by default.
                  securityContext:
                    fsGroup: 1000
                  # Pinned to worker-02 (24-thread AMD Zen 5, AVX-512) for
                  # latency. 5s test clip, model warm: worker-01 (i5-6400T)
                  # ~7-8s with heavy throttling, worker-03 (i5-8500T) ~2.5s.
                  # CPU only - the GPU stays ik-llama's. Selected by NFD vendor
                  # label (worker-02 is the only AMD node) rather than
                  # kubernetes.io/hostname: hostnames carry the domain, and
                  # {{ domainname }} resolves to "apps.<domain>", not the node
                  # suffix.
                  nodeSelector:
                    feature.node.kubernetes.io/cpu-model.vendor_id: AMD
                  # worker-02 is tainted to keep general workloads off it after
                  # the 2026-08-09 node-hang (global OOM). Speaches is allowed
                  # on only because its memory is small and hard-capped below.
                  tolerations:
                    - key: dedicated
                      operator: Equal
                      value: gpu-inference
                      effect: NoSchedule
                initContainers:
                  # Speaches v0.8.x doesn't download models on request (a
                  # transcription for a model that isn't in the HF cache just
                  # fails), so fetch it into the cache PVC up front. Same image,
                  # so huggingface_hub and HF_HOME match the server.
                  fetch-model:
                    image:
                      repository: ghcr.io/speaches-ai/speaches
                      pullPolicy: IfNotPresent
                      tag: 0.8.3-cpu
                    command:
                      - python
                      - -c
                      - |
                        from huggingface_hub import snapshot_download
                        snapshot_download("Systran/faster-whisper-small.en")
                containers:
                  main:
                    image:
                      repository: ghcr.io/speaches-ai/speaches
                      pullPolicy: IfNotPresent
                      tag: 0.8.3-cpu
                    env:
                      WHISPER__INFERENCE_DEVICE: cpu
                      WHISPER__COMPUTE_TYPE: int8
                      # Default 300s unloads the model after 5 idle minutes, so
                      # the first command after a quiet spell pays a cold load.
                      # -1 keeps it resident. (0.8.3 reads WHISPER__TTL; the
                      # STT_MODEL_TTL name only exists in later versions.)
                      WHISPER__TTL: "-1"
                      # Match the CPU limit below.
                      WHISPER__CPU_THREADS: "8"
                      ENABLE_UI: "false"
                      LOG_LEVEL: info
                    # Speaches loads models lazily, so the first request after a
                    # restart took ~8-12s. Load it as soon as the server is up
                    # (201 = loaded, 409 = already loaded). Probes don't start
                    # until postStart returns, so the pod only goes Ready (and
                    # LiteLLM only gets routed to it) once the model is in
                    # memory; a failed hook restarts the container.
                    lifecycle:
                      postStart:
                        exec:
                          command:
                            - python
                            - -c
                            - |
                              import time, urllib.request, urllib.error
                              base = "http://localhost:8000"
                              for _ in range(120):
                                  try:
                                      urllib.request.urlopen(base + "/health", timeout=2)
                                      break
                                  except Exception:
                                      time.sleep(1)
                              req = urllib.request.Request(
                                  base + "/api/ps/Systran/faster-whisper-small.en", method="POST")
                              try:
                                  urllib.request.urlopen(req, timeout=120)
                              except urllib.error.HTTPError as e:
                                  if e.code != 409:
                                      raise
                    ports:
                      - name: http
                        containerPort: 8000
                        protocol: TCP
                    probes:
                      liveness:
                        enabled: true
                        type: HTTP
                        path: /health
                        port: 8000
                        spec:
                          periodSeconds: 15
                          timeoutSeconds: 5
                      readiness:
                        enabled: true
                        type: HTTP
                        path: /health
                        port: 8000
                        spec:
                          periodSeconds: 10
                          timeoutSeconds: 5
                    # CPU request tiny: idle between commands, bursts only while
                    # transcribing (the limit is what matters).
                    # Memory measured on worker-03 under 3 concurrent requests:
                    # ~595Mi anon + ~420Mi reclaimable page cache. 1Gi limit
                    # keeps worker-02's worst case (ik-llama 24Gi + this + system
                    # pods) under the node's ~30Gi.
                    resources:
                      requests:
                        cpu: 100m
                        memory: 768Mi
                      limits:
                        cpu: "8"
                        memory: 1Gi
            persistence:
              hf-cache:
                type: persistentVolumeClaim
                accessMode: ReadWriteOnce
                size: 2Gi
                storageClass: synas-csi-delete
                globalMounts:
                  - path: /home/ubuntu/.cache/huggingface
            service:
              main:
                primary: true
                enabled: true
                controller: main
                ports:
                  http:
                    port: 8000
        repoURL: https://bjw-s-labs.github.io/helm-charts
        chart: app-template
        targetRevision: 4.6.2
      destination:
        server: '{{server}}'
        namespace: speaches
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
