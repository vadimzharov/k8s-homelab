apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: prometheus-mcp
  namespace: argocd
  annotations:
    appset-dashboard-appname: "Prometheus MCP server + agent"
    appset-dashboard-groupname: "AI tools"
spec:
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  prometheus: "installed"
          - plugin:
              configMapRef:
                name: argocd-secrets-plugin
              input:
                parameters:
                  secretName: "k8s-clusters-apps-secrets"
  template:
    metadata:
      name: '{{name}}-prometheus-mcp'
    spec:
      project: k8s-homelab-apps
      sources:
      - helm:
          releaseName: prometheus-mcp
          values: |
            # prometheus/prometheus-mcp (official, upstream Prometheus
            # project) - talks directly to Prometheus's own HTTP API, no
            # Grafana hop. Replaces the earlier grafana-mcp-based
            # approach (see docs/18 in k8s-ai-homelab): all three
            # incidents hit building that were grafana-mcp/mcp-grafana-
            # specific quirks (PreSync deadlock on its token-bootstrap
            # Job, mcp-grafana's DNS-rebinding Host check, its bare-host
            # GRAFANA_URL requirement), not inherent to giving an agent
            # Prometheus access - none of that exists here.
            #
            # Internal-only, no auth - same trust model as argocd-mcp/
            # k8s-hub-mcp: the network boundary (ClusterIP, no ingress)
            # is the real security boundary, matching every other
            # internal-only MCP server in this repo.
            #
            # tsdbAdmin.enabled is deliberately left at its chart default
            # (false) - that's what keeps this read-only (no
            # snapshot/delete_series/clean_tombstones tools loaded).
            prometheus:
              url: "http://prometheus-kube-prometheus-prometheus.prometheus.svc.cluster.local:9090"
            mcp:
              # 11 "core" tools (query, range_query, label_names/values,
              # metric_metadata, series, docs_*, runbooks_*) always load
              # regardless of this list - this only controls the optional
              # ones. Explicitly excludes quit/reload: despite being
              # labeled "read-only" upstream (they don't touch TSDB data),
              # they're operational control actions (shut down / trigger
              # a config reload) with no place being reachable from a chat
              # agent. Also excludes config/flags/wal_replay_status -
              # internal server admin/debug info, not needed for metrics
              # analysis.
              # list_targets/targets_metadata dropped 2026-08-22: live
              # testing showed the agent calling either of these
              # consistently triggers kagent's built-in ask_user
              # elicitation tool (a genuine kagent-side bug, not a
              # prompt issue - reproduced across differently-worded
              # prompts, an explicit cluster= filter, and even a proper
              # A2A follow-up answering the question directly; the model
              # states the right value and calls ask_user again anyway).
              # See docs/18 in k8s-ai-homelab for the full incident. Not
              # relevant to the standalone prometheus-agent below (no
              # kagent involved), worth re-adding once confirmed clean.
              # Every other tool tested clean (query, label_values,
              # etc.) - narrower fix than dropping kagent altogether.
              tools:
                - build_info
                - healthy
                - ready
                - list_alerts
                - list_rules
                - tsdb_stats
                - runtime_info
                - alertmanagers
                - exemplar_query
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 500m
                memory: 256Mi
        repoURL: oci://ghcr.io/tjhop/charts/prometheus-mcp-server
        chart: prometheus-mcp-server
        targetRevision: 0.18.0
      # Standalone A2A agent (github.com/vadimzharov/prometheus-agent)
      # replacing the manually-installed instance - see k8s-ai-homelab
      # docs/19. Co-located with prometheus-mcp above and with LiteLLM
      # (both on k8s02) - no HTTPRoute needed.
      - helm:
          releaseName: prometheus-agent
          values: |
            litellm:
              baseUrl: "https://litellm.{{ domainname }}/v1"
              model: "qwen3.6-27b"
              # Inline key - the chart creates its own Secret from this
              # value directly. Same Vault-backed token kagent used for
              # its own ModelConfig, reused across all standalone agents.
              apiKey: {{litellm-kagent-key}}
            prometheusMcp:
              url: "http://prometheus-mcp-prometheus-mcp-server.prometheus-mcp.svc.cluster.local:8080/mcp"
        repoURL: oci://ghcr.io/vadimzharov/charts/prometheus-agent
        targetRevision: 0.0.4
        path: .
      destination:
        server: '{{server}}'
        namespace: prometheus-mcp
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
