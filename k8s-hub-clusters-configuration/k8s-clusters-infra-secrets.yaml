apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: k8s-clusters-infra-secrets
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: k8s-clusters-infra-secrets
    creationPolicy: Owner
  data:
  - secretKey: k8s-nfs-server-name
    remoteRef:
      key: infra/nfs
      property: k8s-nfs-server-name
  - secretKey: k8s-nfs-share-name
    remoteRef:
      key: infra/nfs
      property: k8s-nfs-share-name