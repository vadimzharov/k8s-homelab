apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: k8s-hub-network-secrets
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: k8s-hub-network-secrets
    creationPolicy: Owner
  data:
  - secretKey: nginxingressip
    remoteRef:
      key: clusters/k8s02/ingress
      property: nginxingressip

