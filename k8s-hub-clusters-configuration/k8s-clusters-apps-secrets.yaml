apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: k8s-apps-configs
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: k8s-apps-configs
    creationPolicy: Owner
  data:
  - secretKey: vpnswitcher-config
    remoteRef:
      key: apps/configs
      property: vpnswitcher-config
