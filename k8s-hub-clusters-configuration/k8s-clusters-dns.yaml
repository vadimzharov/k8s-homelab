apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: k8s-clusters-dns-secrets
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: k8s-clusters-dns-secrets
    creationPolicy: Owner
  data:
  - secretKey: edgednsserver
    remoteRef:
      key: infra/pihole
      property: edgednsserver
  - secretKey: firstdnsserver
    remoteRef:
      key: infra/pihole
      property: firstdnsserver
  - secretKey: seconddnsserver
    remoteRef:
      key: infra/pihole
      property: seconddnsserver
  - secretKey: piholepassword
    remoteRef:
      key: infra/pihole
      property: piholepassword