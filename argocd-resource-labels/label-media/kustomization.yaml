apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

patches:
  - target:
      group: networking.k8s.io
      kind: Ingress
    patch: |
      - op: add
        path: /metadata/labels/k8s-dashboard-group
        value: media

  - target:
      group: gateway.networking.k8s.io
      kind: HTTPRoute
    patch: |
      - op: add
        path: /metadata/labels/k8s-dashboard-group
        value: media