apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: pihole-dns-sync
  namespace: argocd
  annotations:
    avp.kubernetes.io/path: "k8secrets/infra/pihole"
spec:
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  pihole-sync: "installed"
          - plugin:
              # Specify the configMap where the plugin configuration is located.
              configMapRef:
                name: argocd-secrets-plugin
              input:
                parameters:
                  secretName: "k8s-clusters-dns-secrets"
  template:
    metadata:
      name: '{{name}}-pihole-dns-sync' 
    spec:
      project: k8s-homelab-infra
      sources:                        
      - helm:
          releaseName: 'edge-dns-sync'
          values: |
            sources:
              - ingress
            policy: '{{metadata.labels.external-dns-policy}}'
            registry: noop
            provider: pihole
            env:
              - name: "EXTERNAL_DNS_PIHOLE_SERVER"
                value: {{ edge-dns-server }}
              - name: "EXTERNAL_DNS_PIHOLE_PASSWORD"
                value: "{{ pihole-password }}"
        repoURL: https://kubernetes-sigs.github.io/external-dns/
        chart: external-dns
        targetRevision: 1.13.1        
      destination:
        server: '{{server}}'
        namespace: pihole
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          