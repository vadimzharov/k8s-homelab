apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: pihole-dns-sync
  namespace: argocd
spec:
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  pihole-sync: "installed"
              values:
                dnspolicy: '{{ metadata.labels.external-dns-policy }}'
          - plugin:
              # Specify the configMap where the plugin configuration is located.
              configMapRef:
                name: argocd-secrets-plugin
              input:
                parameters:
                  secretName: "k8s-clusters-dns-secrets"
  template:
    metadata:
      name: '{{name}}-pihole-dns-sync' 
    spec:
      project: k8s-homelab-infra
      sources:                        
      - helm:
          releaseName: 'edge-dns-sync'
          values: |
            sources:
              - ingress
              - gateway-httproute              
            policy: "{{ values.dnspolicy }}"
            registry: noop
            provider: pihole
            env:
              - name: "EXTERNAL_DNS_PIHOLE_SERVER"
                value: {{ edgednsserver }}
              - name: "EXTERNAL_DNS_PIHOLE_PASSWORD"
                value: "{{ piholepassword }}"
        repoURL: https://kubernetes-sigs.github.io/external-dns/
        chart: external-dns
        targetRevision: 1.19.0
      - helm:
          releaseName: 'first-dns-sync'
          parameters:
            - name: installCRDs
              value: "false"          
          values: |
            sources:
              - ingress
              - gateway-httproute              
            policy: "{{ values.dnspolicy }}"
            registry: noop
            provider: pihole
            env:
              - name: "EXTERNAL_DNS_PIHOLE_SERVER"
                value: {{ firstdnsserver }}
              - name: "EXTERNAL_DNS_PIHOLE_PASSWORD"
                value: "{{ piholepassword }}"
        repoURL: https://kubernetes-sigs.github.io/external-dns/
        chart: external-dns
        targetRevision: 1.19.0
      - helm:
          releaseName: 'second-dns-sync'
          parameters:
            - name: installCRDs
              value: "false"
          values: |
            sources:
              - ingress
              - gateway-httproute
            policy: "{{ values.dnspolicy }}"
            registry: noop
            provider: pihole
            gatewayNamespace: cilium-system
            env:
              - name: "EXTERNAL_DNS_PIHOLE_SERVER"
                value: {{ seconddnsserver }}
              - name: "EXTERNAL_DNS_PIHOLE_PASSWORD"
                value: "{{ piholepassword }}"
        repoURL: https://kubernetes-sigs.github.io/external-dns/
        chart: external-dns
        targetRevision: 1.19.0
      destination:
        server: '{{server}}'
        namespace: pihole
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          