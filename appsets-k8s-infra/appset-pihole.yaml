apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: pihole
  namespace: argocd
spec:
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  pihole: "installed"
          - plugin:
              configMapRef:
                name: argocd-secrets-plugin
              input:
                parameters:
                  secretName: "{{ name }}-pihole-secrets"
  template:
    metadata:
      name: '{{name}}-pihole'   
    spec:
      project: k8s-homelab-infra
      sources:      
      - helm:
          releaseName: 'pihole-{{ name }}'
          values: |
            ingress:
              enabled: true
              ingressClassName: nginx
              annotations:
                nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
              labels:
                k8s-dashboard-group: tools   
              hosts:
                - pihole-{{ name }}.{{ domainname }}
            serviceWeb:
              annotations:
                service.cilium.io/global: "true"
            serviceDns:
              mixedService: true
              type: LoadBalancer
              loadBalancerIP: {{ piholelpip }}
            serviceDhcp:
              enabled: false
            extraEnvVars:
              DNSMASQ_USER: "root"               
            DNS1: {{ piholeupstreamdns }}
            DNS2: {{ piholeupstreamdns }}
            adminPassword: {{ piholepassword }}
            blacklist:  
            {{ blacklist }}
            whitelist:
            {{ whitelist }}
            podDnsConfig:
              enabled: true
              policy: "None"
              nameservers:
              - 127.0.0.1
              - {{ piholeupstreamdns }}
        repoURL: https://mojo2600.github.io/pihole-kubernetes/
        chart: pihole
        targetRevision: 2.20.0
      destination:
        server: '{{server}}' 
        namespace: pihole
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
      