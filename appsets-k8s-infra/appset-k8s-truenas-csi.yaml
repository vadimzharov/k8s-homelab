apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: truenas-csi
  namespace: argocd
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  truenas-csi: "installed"
          - plugin:
              configMapRef:
                name: argocd-secrets-plugin
              input:
                parameters:
                  secretName: "k8s-clusters-infra-secrets"
  template:
    metadata:
      name: '{{name}}-truenas-csi' 
    spec:
      project: k8s-homelab-infra
      sources:
      - repoURL: https://github.com/truenas/truenas-csi.git
        targetRevision: 'v1.0.1'
        path: deploy/
        #include: 'truenas-csi-driver.yaml'
      - helm:
          releaseName: csi-config
          values: |
            controllers: 
              main:
               enabled: false
            rawResources:
              truenas-api-creds:
                apiVersion: v1
                kind: Secret
                forceRename: "truenas-api-credentials"                
                spec:
                  stringData:
                    api-key: "{{truenas-api-key}}"
              truenas-csi-config:
                apiVersion: v1
                kind: ConfigMap
                forceRename: "truenas-csi-config"
                spec:
                  data:
                    truenasURL: "wss://{{truenas-ip}}/api/current"
                    truenasInsecure: "true"
                    defaultPool: "main-pool"
                    nfsServer: "{{truenas-ip}}"
                    iscsiPortal: "{{truenas-ip}}:3260"
              truenas-csi-storage-class:
                apiVersion: storage.k8s.io/v1
                kind: StorageClass
                forceRename: "truenas-iscsi"
                spec:
                  provisioner: csi.truenas.io
                  parameters:
                    protocol: "iscsi"
                    # ZFS compression
                    compression: "LZ4"
                    # ZVOL block size: 512, 1K, 2K, 4K, 8K, 16K, 32K, 64K, 128K
                    volblocksize: "16K"
                    # iSCSI logical block size: 512, 1024, 2048, 4096
                    iscsi.blocksize: "4096"
                    iscsi.networks: "{{truenas-networks}}"
                  reclaimPolicy: Delete
                  volumeBindingMode: Immediate
                  allowVolumeExpansion: true
        repoURL: https://bjw-s-labs.github.io/helm-charts
        chart: app-template
        targetRevision: 4.4.0
      - helm:
          releaseName: csi-patch
          values: |
            controllers: 
              main:
               enabled: false
            rawResources:
              truenas-patched-daemonset:
                apiVersion: apps/v1
                kind: DaemonSet
                forceRename: "truenas-csi-node" 
                spec:
                  spec:
                    selector:
                      matchLabels:
                        app: truenas-csi-node
                    template:
                      metadata:
                        creationTimestamp: null
                        labels:
                          app: truenas-csi-node
                      spec:
                        volumes:
                          - name: registration-dir
                            hostPath:
                              path: /var/lib/kubelet/plugins_registry/
                              type: DirectoryOrCreate
                          - name: plugin-dir
                            hostPath:
                              path: /var/lib/kubelet/plugins/csi.truenas.io/
                              type: DirectoryOrCreate
                          - name: kubelet-dir
                            hostPath:
                              path: /var/lib/kubelet
                              type: Directory
                          - name: device-dir
                            hostPath:
                              path: /dev
                              type: ''
                          - name: iscsi-dir
                            hostPath:
                              path: /etc/iscsi
                              type: Directory
                          - name: iscsi-lib
                            hostPath:
                              path: /var/lib/iscsi
                              type: DirectoryOrCreate
                          - name: host-root
                            hostPath:
                              path: /
                              type: Directory
                          - name: host-lib
                            hostPath:
                              path: /usr/lib
                          - name: host-lib64
                            hostPath:
                              path: /usr/lib64                              
                        containers:
                          - name: csi-node
                            image: ghcr.io/truenas/truenas-csi:latest
                            args:
                              - '--endpoint=$(CSI_ENDPOINT)'
                              - '--node-id=$(NODE_ID)'
                              - '--v=4'
                            env:
                              - name: CSI_ENDPOINT
                                value: unix:///csi/csi.sock
                              - name: TRUENAS_URL
                                valueFrom:
                                  configMapKeyRef:
                                    name: truenas-csi-config
                                    key: truenasURL
                              - name: TRUENAS_API_KEY
                                valueFrom:
                                  secretKeyRef:
                                    name: truenas-api-credentials
                                    key: api-key
                              - name: TRUENAS_DEFAULT_POOL
                                valueFrom:
                                  configMapKeyRef:
                                    name: truenas-csi-config
                                    key: defaultPool
                              - name: TRUENAS_NFS_SERVER
                                valueFrom:
                                  configMapKeyRef:
                                    name: truenas-csi-config
                                    key: nfsServer
                              - name: TRUENAS_ISCSI_PORTAL
                                valueFrom:
                                  configMapKeyRef:
                                    name: truenas-csi-config
                                    key: iscsiPortal
                              - name: TRUENAS_ISCSI_IQN_BASE
                                valueFrom:
                                  configMapKeyRef:
                                    name: truenas-csi-config
                                    key: iscsiIQNBase
                                    optional: true
                              - name: TRUENAS_INSECURE_SKIP_VERIFY
                                valueFrom:
                                  configMapKeyRef:
                                    name: truenas-csi-config
                                    key: truenasInsecure
                                    optional: true
                              - name: NODE_ID
                                valueFrom:
                                  fieldRef:
                                    apiVersion: v1
                                    fieldPath: spec.nodeName
                            resources:
                              limits:
                                cpu: 200m
                                memory: 256Mi
                              requests:
                                cpu: 100m
                                memory: 128Mi
                            volumeMounts:
                              - name: plugin-dir
                                mountPath: /csi
                              - name: kubelet-dir
                                mountPath: /var/lib/kubelet
                                mountPropagation: Bidirectional
                              - name: device-dir
                                mountPath: /dev
                              - name: iscsi-dir
                                mountPath: /etc/iscsi
                                mountPropagation: Bidirectional
                              - name: iscsi-lib
                                mountPath: /var/lib/iscsi
                                mountPropagation: Bidirectional
                              - name: host-root
                                mountPath: /host
                                mountPropagation: Bidirectional
                              - name: host-lib
                                mountPath: /lib
                                readOnly: true
                              - name: host-lib64
                                mountPath: /lib64
                                readOnly: true
                            livenessProbe:
                              httpGet:
                                path: /healthz
                                port: 9808
                                scheme: HTTP
                              initialDelaySeconds: 10
                              timeoutSeconds: 3
                              periodSeconds: 10
                              successThreshold: 1
                              failureThreshold: 5
                            lifecycle:
                              postStart:
                                exec:
                                  command:
                                    - /bin/sh
                                    - '-c'
                                    - >-
                                      mkdir -p /run/lock/iscsi && mv /usr/sbin/iscsiadm
                                      /usr/sbin/iscsiadm.orig 2>/dev/null; printf
                                      '#!/bin/sh\nnsenter --mount=/host/proc/1/ns/mnt --
                                      /usr/sbin/iscsiadm "$@"\n' > /usr/sbin/iscsiadm && chmod +x
                                      /usr/sbin/iscsiadm && cp /host/usr/bin/lsblk /usr/bin/lsblk
                            terminationMessagePath: /dev/termination-log
                            terminationMessagePolicy: File
                            imagePullPolicy: IfNotPresent
                            securityContext:
                              privileged: true
                          - name: csi-node-driver-registrar
                            image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.16.0
                            args:
                              - '--csi-address=$(ADDRESS)'
                              - '--kubelet-registration-path=$(DRIVER_REG_SOCK_PATH)'
                              - '--v=5'
                            env:
                              - name: ADDRESS
                                value: /csi/csi.sock
                              - name: DRIVER_REG_SOCK_PATH
                                value: /var/lib/kubelet/plugins/csi.truenas.io/csi.sock
                            resources: {}
                            volumeMounts:
                              - name: plugin-dir
                                mountPath: /csi
                              - name: registration-dir
                                mountPath: /registration
                            terminationMessagePath: /dev/termination-log
                            terminationMessagePolicy: File
                            imagePullPolicy: IfNotPresent
                          - name: liveness-probe
                            image: registry.k8s.io/sig-storage/livenessprobe:v2.18.0
                            args:
                              - '--csi-address=/csi/csi.sock'
                              - '--health-port=9808'
                            resources: {}
                            volumeMounts:
                              - name: plugin-dir
                                mountPath: /csi
                            terminationMessagePath: /dev/termination-log
                            terminationMessagePolicy: File
                            imagePullPolicy: IfNotPresent
                        restartPolicy: Always
                        terminationGracePeriodSeconds: 30
                        dnsPolicy: ClusterFirst
                        serviceAccountName: truenas-csi-node-sa
                        serviceAccount: truenas-csi-node-sa
                        hostNetwork: true
                        hostPID: true
                        hostIPC: true
                        securityContext: {}
                        schedulerName: default-scheduler
                        tolerations:
                          - operator: Exists
                        priorityClassName: system-node-critical
                    updateStrategy:
                      type: RollingUpdate
                      rollingUpdate:
                        maxUnavailable: 1
                        maxSurge: 0
                    revisionHistoryLimit: 10


        repoURL: https://bjw-s-labs.github.io/helm-charts
        chart: app-template
        targetRevision: 4.4.0                  
      destination:
        server: '{{server}}'
        namespace: truenas-csi
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          