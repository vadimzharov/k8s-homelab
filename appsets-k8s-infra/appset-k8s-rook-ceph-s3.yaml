apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: rook-ceph-s3-cluster
  namespace: argocd
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  rook-ceph-operator: "installed"
                  rook-ceph-s3: "installed"
          - plugin:
              configMapRef:
                name: argocd-secrets-plugin
              input:
                parameters:
                  secretName: "k8s-clusters-apps-secrets"
  template:
    metadata:
      name: '{{name}}-rook-ceph-s3' 
    spec:
      project: k8s-homelab-infra
      sources:
      - helm:
          releaseName: rook-ceph
          values: |
            operatorNamespace: rook-ceph

            cephClusterSpec:
              mgr:
                count: 1
                allowMultiplePerNode: true
              mon:
                count: 1
                allowMultiplePerNode: true
                volumeClaimTemplate:
                  spec:
                    storageClassName: freenas-iscsi-csi
                    resources:
                      requests:
                        storage: 10Gi
              crashCollector:
                disable: true
              resources:
                mgr:
                  limits:
                    cpu: "500m"
                    memory: "1Gi"
                  requests:
                    cpu: "50m"
                    memory: "64Mi"
                mon:
                  limits:
                    cpu: "500m"                  
                    memory: "2Gi"
                  requests:
                    cpu: "100m"
                    memory: "128Mi"
                osd:
                  limits:
                    cpu: "1"                  
                    memory: "4Gi"
                  requests:
                    cpu: "100m"
                    memory: "1Gi"
              storage:
                storageClassDeviceSets:
                  - name: set1
                    count: 1 
                    portable: false
                    encrypted: false
                    volumeClaimTemplates:
                      - metadata:
                          name: data
                        spec:
                          storageClassName: freenas-iscsi-csi
                          volumeMode: Block
                          accessModes:
                            - ReadWriteOnce
                          resources:
                            requests:
                              storage: 100Gi

            # S3 only config
            cephBlockPools: []
            cephFileSystems: []

            cephObjectStores:
              - name: ceph-objectstore
                spec:
                  metadataPool:
                    replicated:
                      size: 1
                  dataPool:
                    replicated:
                      size: 1
                  preservePoolsOnDelete: true
                  gateway:
                    port: 80
                    instances: 1
                storageClass:
                  enabled: true   
                  name: ceph-bucket
                  reclaimPolicy: Delete
                  parameters:
                    region: us-east-1
        repoURL: https://charts.rook.io/release
        chart: rook-ceph-cluster
        targetRevision: v1.19.3
      - helm:
          releaseName: s3-httproute
          values: |
            controllers: 
              main:
               enabled: false
            rawResources:
              s3httproute:
                apiVersion: gateway.networking.k8s.io/v1beta1
                kind: HTTPRoute
                forceRename: "s3-httproute"                
                spec:
                  spec:
                    hostnames:
                      - rook-s3.{{domainname}}
                    parentRefs:
                      - group: gateway.networking.k8s.io
                        kind: Gateway
                        name: '{{ metadata.labels.rook-ceph-s3-route-gw }}'
                        namespace: cilium-system
                        sectionName: https-gw
                      - group: gateway.networking.k8s.io
                        kind: Gateway
                        name: '{{ metadata.labels.rook-ceph-s3-route-gw }}'
                        namespace: cilium-system
                        sectionName: https-gw-5k
                    rules:
                      - backendRefs:
                          - name: rook-ceph-rgw-ceph-objectstore
                            port: 80                      
        repoURL: https://bjw-s-labs.github.io/helm-charts
        chart: app-template
        targetRevision: 4.4.0        
      destination:
        server: '{{server}}'
        namespace: rook-ceph
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          