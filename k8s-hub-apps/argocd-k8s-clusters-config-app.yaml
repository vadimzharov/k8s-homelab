    apiVersion: argoproj.io/v1alpha1
    kind: Application
    metadata:
      name: k8s-homelab-cluster-configs
      namespace: argocd
      finalizers:
      - resources-finalizer.argocd.argoproj.io
      annotations:
        argocd.argoproj.io/compare-options: IgnoreExtraneous
    spec:
      destination:
        namespace: argocd
        server: https://kubernetes.default.svc
      project: k8s-homelab-clusters-config
      source:
        path: "k8s-hub-clusters-configuration"
        repoURL: "https://github.com/vadimzharov/k8s-homelab.git"
        targetRevision: "main"
      syncPolicy:
        syncOptions:
        - CreateNamespace=true
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false