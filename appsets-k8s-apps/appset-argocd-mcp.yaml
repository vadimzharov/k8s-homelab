apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: argocd-mcp
  namespace: argocd
  annotations:
    appset-dashboard-appname: "ArgoCD MCP Server"
    appset-dashboard-groupname: "AI tools"
spec:
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  argocd-mcp: "installed"
          - plugin:
              configMapRef:
                name: argocd-secrets-plugin
              input:
                parameters:
                  secretName: "k8s-clusters-apps-secrets"
  template:
    metadata:
      name: '{{name}}-argocd-mcp'
    spec:
      project: k8s-homelab-apps
      sources:
      - helm:
          releaseName: argocd-mcp
          values: |
            controllers:
              main:
                type: deployment
                containers:
                  main:
                    image:
                      repository: ghcr.io/argoproj-labs/mcp-for-argocd
                      tag: main
                    env:
                      ARGOCD_BASE_URL:
                        value: "https://argocd.{{ domainname }}"
                      ARGOCD_API_TOKEN:
                        value: "{{ argocd-api-token }}"
                    args:
                      - http
                      - --stateless
            service:
              main:
                primary: true
                enabled: true
                controller: main
                ports:
                  http:
                    port: 3000
            route:
              main:
                enabled: true
                kind: HTTPRoute
                annotations:
                  k8s-dashboard-group: AI tools
                  k8s-dashboard-appname: ArgoCD MCP Server
                parentRefs:
                  - name: cilium-gw
                    namespace: cilium-system
                hostnames:
                  - argocd-mcp.{{ domainname }}
                rules:
                  - matches:
                      - path:
                          type: PathPrefix
                          value: /
                    backendRefs:
                      - name: argocd-mcp
                        port: 3000
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 500m
                memory: 256Mi
          repoURL: https://bjw-s-labs.github.io/helm-charts
          chart: app-template
          targetRevision: 3.4.0
      destination:
        server: '{{server}}'
        namespace: argocd-mcp
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
