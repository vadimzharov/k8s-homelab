apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: firefox-v
  namespace: argocd
spec:
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  firefox-v: "installed"
          - plugin:
              configMapRef:
                name: argocd-secrets-plugin
              input:
                parameters:
                  secretName: "k8s-clusters-apps-secrets"
  template:
    metadata:
      name: '{{name}}-firefox-v'
    spec:
      project: k8s-homelab-apps
      sources:
      - helm:
          releaseName: firefox
          values: |      
            service:
              main:
                primary: true
                enabled: true
                controller: main                
                ports:
                  http:
                    port: 3000
            ingress:
              main:
                enabled: true
                className: nginx
                hosts:
                  - host: firefox-v.{{ domainname }}
                    paths:
                      - path: /
                        pathType: Prefix
                        service:
                          name: firefox
                          port: 3000
            persistence:
              config:
                enabled: true
                type: emptyDir
                globalMounts: 
                  - path: /config/
            secrets:
              b-r-secret:
                enabled: true
                labels: {}
                annotations: {}
                stringData:
                  S3_ENDPOINT: {{ minioendpoint }}
                  AWS_KEY: {{ miniokey }}
                  AWS_SECRET_KEY: {{ miniosecretkey }}
            configMaps:
              b-r-settings:
                enabled: true
                data:
                  AWS_BUCKET: "k8s-apps-backup"
                  S3_BUCKET_FOLDER: "firefox-v-config"
                  S3_FILE_PREFIX: "firefox-v-config"
                  SKIP_PATH: "/config/.mozilla/firefox/fawoh5h3.default-release/lock"
                  BACKUP_INTERVAL: "1h"
                  PRUNE_INTERVAL: "48h"
                  COPIES_TO_KEEP: "35"
                  FORCE_RESTORE: "true"
                  DIR_TO_BACKUP: /config/
                  DIR_TO_RESTORE: /config/
                  ARCHIVE_TYPE: targz
            controllers:
              main:
                type: deployment
                enabled: true
                initContainers:
                  firefox-restore:
                    image: 
                      repository: quay.io/vadimzharov/podbackup
                      pullPolicy: IfNotPresent
                      tag: latest
                    command:
                      - podbackup
                    args:
                      - restore
                    envFrom:
                    - secretRef:
                        name: firefox-b-r-secret
                    - configMapRef:
                        name: firefox-b-r-settings
                containers:
                  main:
                    image:
                      repository: lscr.io/linuxserver/firefox
                      pullPolicy: IfNotPresent
                      tag: latest
                    env:
                      CUSTOM_USER: firefox
                      TITLE: "Firefox browser"
                      PASSWORD: {{ password }}
                  firefox-backup-daemon:
                    image: 
                      repository: quay.io/vadimzharov/podbackup
                      pullPolicy: IfNotPresent
                      tag: latest
                    command:
                      - podbackup
                    args:
                      - backup-daemon
                    envFrom:
                    - secretRef:
                        name: firefox-b-r-secret
                    - configMapRef:
                        name: firefox-b-r-settings
        repoURL: https://bjw-s-labs.github.io/helm-charts
        chart: app-template
        targetRevision: 3.4.0
      destination:
        server: '{{server}}' 
        namespace: firefox-v
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
      