apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: firefox-v
  namespace: argocd
  annotations:
    appset-dashboard-appname: "Firefox browser"
    appset-dashboard-groupname: "Remote access"  
spec:
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  firefox-v: "installed"
          - plugin:
              configMapRef:
                name: argocd-secrets-plugin
              input:
                parameters:
                  secretName: "k8s-clusters-apps-secrets"
  template:
    metadata:
      name: '{{name}}-firefox-v'
    spec:
      project: k8s-homelab-apps
      sources:
      - helm:
          releaseName: firefox
          values: |      
            service:
              main:
                primary: true
                enabled: true
                controller: main                
                ports:
                  http:
                    port: 3000
            route:
              main:
                enabled: true
                kind: HTTPRoute
                labels:
                  k8s-dashboard-group: Remote-work
                  k8s-dashboard-appname: Firefox-V
                parentRefs:
                  - name: cilium-gw
                    namespace: cilium-system
                hostnames:
                  - firefox-v.{{ domainname }}
                rules:  
                - matches:
                  - path:
                      type: PathPrefix
                      value: /
                  backendRefs:
                  - name: firefox
                    port: 3000
            persistence:
              config:
                enabled: true
                type: emptyDir
                globalMounts: 
                  - path: /config/
            secrets:
              b-r-secret:
                enabled: true
                labels: {}
                annotations: {}
                stringData:
                  PDBACKUP_S3_ENDPOINT: {{ minioendpoint }}
                  PDBACKUP_S3_ACCESS_KEY: {{ miniokey }}
                  PDBACKUP_S3_SECRET_KEY: {{ miniosecretkey }}
            configMaps:
              b-r-settings:
                enabled: true
                data:
                  PDBACKUP_S3_BUCKET: "k8s-apps-pdbackup"
                  PDBACKUP_S3_PREFIX: "firefox-v-config"
                  PDBACKUP_BACKUP_INTERVAL: "1h"
                  PDBACKUP_RETENTION_KEEP_LATEST: "10"
                  PDBACKUP_FORCE_RESTORE: "false"
                  PDBACKUP_SOURCE_DIR: /config/
                  PDBACKUP_TARGET_DIR: /config/
                  PDBACKUP_KOPIA_PASSWORD: {{ encryptpassword }}
                  PDBACKUP_HOSTNAME: firefox-v-config
            controllers:
              main:
                type: deployment
                enabled: true
                initContainers:
                  firefox-restore:
                    image: 
                      repository: ghcr.io/vadimzharov/pdbackup
                      pullPolicy: IfNotPresent
                      tag: latest
                    args:
                      - restore
                    envFrom:
                    - secretRef:
                        name: firefox-b-r-secret
                    - configMapRef:
                        name: firefox-b-r-settings
                containers:
                  main:
                    image:
                      repository: lscr.io/linuxserver/firefox
                      pullPolicy: IfNotPresent
                      tag: latest
                    env:
                      CUSTOM_USER: firefox
                      TITLE: "Firefox browser"
                      PASSWORD: {{ password }}
                  firefox-backup-daemon:
                    image: 
                      repository: ghcr.io/vadimzharov/pdbackup
                      pullPolicy: IfNotPresent
                      tag: latest
                    args:
                      - daemon
                    envFrom:
                    - secretRef:
                        name: firefox-b-r-secret
                    - configMapRef:
                        name: firefox-b-r-settings
        repoURL: https://bjw-s-labs.github.io/helm-charts
        chart: app-template
        targetRevision: 3.4.0
      destination:
        server: '{{server}}' 
        namespace: firefox-v
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
      