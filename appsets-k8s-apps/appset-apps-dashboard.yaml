apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: k8s-apps-dashboard
  namespace: argocd
  annotations:
    ai-agent-inventory-appname: "K8s Apps Dashboard"
    appset-dashboard-appname: "Applications Dashboard"
    appset-dashboard-groupname: "Dashboards"
    k8s-dashboard-group: "Dashboards"
    k8s-dashboard-appname: "My applications"    
spec:
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  k8s-apps-dashboard: "installed"
          - plugin:
              configMapRef:
                name: argocd-secrets-plugin
              input:
                parameters:
                  secretName: "k8s-clusters-apps-secrets"  
  template:
    metadata:
      name: '{{name}}-k8s-apps-dashboard'
    spec:
      project: k8s-homelab-apps
      sources:
      - helm:
          releaseName: k8s-apps-dashboard
          values: |
            deploymentNamespace: k8s-apps-dashboard
            clusterMetrics:
              enabled: true
              interval: 5m
            image:
              repository: quay.io/vadimzharov/homelab-k8s-dashboard
              pullPolicy: Always
              tag: "v0.1.7"
            ingress:
              enabled: true
              pathType: Prefix
              paths:
                - /
              class: nginx
              hosts:
                - host: my.{{ domainname }}
                  paths:
                    - /
              annotations:
                k8s-dashboard-group: Dashboards
                k8s-dashboard-appname: My applications
            routeRefreshInterval: "1m"
            ui:
              header: "My Homelab Dashboard"
              subheader: "Applications deployed across all my Kubernetes clusters"                    
        repoURL: oci://ghcr.io/vadimzharov/homelab-k8s-dashboard/homelab-k8s-dashboard:0.1.6
        targetRevision: 0.1.6
        path: .
      destination:
        server: '{{server}}' 
        namespace: k8s-apps-dashboard
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
      
