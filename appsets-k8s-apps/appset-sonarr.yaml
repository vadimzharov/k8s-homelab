apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: sonarr
  namespace: argocd
  annotations:
    appset-dashboard-appname: "Sonarr media server"
    appset-dashboard-groupname: "Media"
spec:
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  sonarr: "installed"
                  csi-nfs: "installed"
          - plugin:
              configMapRef:
                name: argocd-secrets-plugin
              input:
                parameters:
                  secretName: "k8s-clusters-apps-secrets"
  template:
    metadata:
      name: '{{name}}-sonarr'
    spec:
      project: k8s-homelab-apps
      sources:
      - helm:
          releaseName: sonarr
          values: |
            controllers:            
              main:
                type: deployment
                initContainers:
                  sonarr-restore-config:
                    image: 
                      repository: ghcr.io/vadimzharov/pdbackup
                      pullPolicy: IfNotPresent
                      tag: 0.0.8
                    args: 
                      - restore
                    envFrom:
                    - secretRef:
                       name: sonarr-pdbackup-secret
                    - configMapRef:
                       name: sonarr-pdbackup-settings            
                containers:
                  main:
                    image: 
                      repository: lscr.io/linuxserver/sonarr
                      pullPolicy: IfNotPresent
                      tag: latest
                  sonarr-backup-config-daemon:
                    image: 
                      repository: ghcr.io/vadimzharov/pdbackup
                      pullPolicy: IfNotPresent
                      tag: 0.0.8
                    args:
                      - daemon
                    envFrom:
                    - secretRef:
                       name: sonarr-pdbackup-secret
                    - configMapRef:
                       name: sonarr-pdbackup-settings    
            service:
              main:
                primary: true
                enabled: true
                controller: main
                ports:
                  http:
                    port: 8989
            route:
              main:
                enabled: true
                kind: HTTPRoute
                labels:
                  k8s-dashboard-group: Media
                  k8s-dashboard-appname: Sonarr                
                parentRefs:
                  - name: cilium-gw
                    namespace: cilium-system
                hostnames:
                  - sonarr.{{ domainname }}
                rules:  
                - matches:
                  - path:
                      type: PathPrefix
                      value: /
                  backendRefs:
                  - name: sonarr
                    port: 8989
            persistence:
              config:
                enabled: true
                type: emptyDir
                globalMounts:
                  - path: /config
                    readOnly: false
              root-folder:
                enabled: true
                type: persistentVolumeClaim
                existingClaim: sonarr-sonarr-pvc                
                globalMounts:
                  - path: /sonarr
                    readOnly: false
              tranarr:
                enabled: true
                type: persistentVolumeClaim
                existingClaim: sonarr-tranarr-pvc
                globalMounts:
                  - path: /tranarr
                    readOnly: false                    
            configMaps:
              pdbackup-settings:
                enabled: true
                data:
                  PDBACKUP_S3_BUCKET: "k8s-apps-pdbackup"                
                  PDBACKUP_S3_PREFIX: "sonarr-pbbackup"
                  PDBACKUP_SOURCE_DIR: "/config"
                  PDBACKUP_TARGET_DIR: "/config"  
                  PDBACKUP_BACKUP_INTERVAL: "1h"
                  PDBACKUP_HOSTNAME: "sonarr"
                  PDBACKUP_RETENTION_KEEP_LATEST: "10"
                  PDBACKUP_FORCE_RESTORE: "true"                
              b-r-settings:
                enabled: true
                data:
                  AWS_BUCKET: "sonarr"
                  S3_BUCKET_FOLDER: "sonarr-config"
                  S3_FILE_PREFIX: "sonarr-config"
                  BACKUP_INTERVAL: "1h"
                  PRUNE_INTERVAL: "48h"
                  COPIES_TO_KEEP: "35"
                  FORCE_RESTORE: "true"
                  DIR_TO_BACKUP: /config
                  DIR_TO_RESTORE: /config
                  ARCHIVE_TYPE: targz
            secrets:
              pdbackup-secret:
                enabled: true
                labels: {}
                annotations: {}
                stringData:
                  PDBACKUP_S3_ENDPOINT: "http://{{ minioendpoint }}"
                  PDBACKUP_S3_ACCESS_KEY: {{ miniokey }}
                  PDBACKUP_S3_SECRET_KEY: {{ miniosecretkey }}
                  PDBACKUP_KOPIA_PASSWORD: {{ encryptpassword }}            
              b-r-creds:
                enabled: true
                labels: {}
                annotations: {}
                stringData:
                  S3_ENDPOINT: {{ minioendpoint }}
                  AWS_KEY: {{ miniokey }}
                  AWS_SECRET_KEY: {{ miniosecretkey }}
            rawResources:
              tranarr-pv:
                apiVersion: v1
                kind: PersistentVolume
                spec:
                  spec:
                    capacity:
                      storage: 10Gi
                    accessModes:
                      - ReadWriteMany
                    persistentVolumeReclaimPolicy: Retain
                    storageClassName: sc-nfs-default
                    csi:
                      driver: nfs.csi.k8s.io
                      readOnly: false
                      # volumeHandle format: {nfs-server-address}#{sub-dir-name}#{share-name}
                      # make sure this value is unique for every share in the cluster
                      volumeHandle: "nfs-server#subdirname#sonarr-app"
                      volumeAttributes:
                        server: {{ k8s-nfs-server-name }}
                        share: {{ k8s-tranarr-share }}
              tranarr-pvc:
                apiVersion: v1
                kind: PersistentVolumeClaim
                spec:
                  spec:
                    storageClassName: sc-nfs-default
                    accessModes:
                      - ReadWriteMany
                    resources:
                      requests:
                        storage: 10Gi
                    volumeName: sonarr-tranarr-pv
              sonarr-pv:
                apiVersion: v1
                kind: PersistentVolume
                spec:
                  spec:
                    capacity:
                      storage: 10Gi
                    accessModes:
                      - ReadWriteMany
                    persistentVolumeReclaimPolicy: Retain
                    storageClassName: sc-nfs-default
                    csi:
                      driver: nfs.csi.k8s.io
                      readOnly: false
                      # volumeHandle format: {nfs-server-address}#{sub-dir-name}#{share-name}
                      # make sure this value is unique for every share in the cluster
                      volumeHandle: "nfs-server#sonarr#sonarr-app"
                      volumeAttributes:
                        #server: {{ k8s-nfs-server-name }}
                        #share: {{ k8s-sonarr-share }}
                        server: {{ truenas-nfs-ip }}
                        share: "{{ truenas-arr-share }}/arr/media/series"
              sonarr-pvc:
                apiVersion: v1
                kind: PersistentVolumeClaim
                spec:
                  spec:
                    storageClassName: sc-nfs-default
                    accessModes:
                      - ReadWriteMany
                    resources:
                      requests:
                        storage: 10Gi
                    volumeName: sonarr-sonarr-pv                    
        repoURL: https://bjw-s-labs.github.io/helm-charts
        chart: app-template
        targetRevision: 3.4.0
      destination:
        server: '{{server}}' 
        namespace: sonarr
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
      
