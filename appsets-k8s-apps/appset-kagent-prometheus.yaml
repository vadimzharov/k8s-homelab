apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kagent-prometheus
  namespace: argocd
  annotations:
    appset-dashboard-appname: "KAgent - Prometheus agent"
    appset-dashboard-groupname: "AI tools"
    k8s-dashboard-group: "AI tools"
    k8s-dashboard-appname: "KAgent - Prometheus agent"
spec:
  generators:
    - matrix:
        generators:
          # Gated on BOTH labels - prevents the duplication bug the
          # earlier grafana-mcp-based agent had (it lived in the
          # generic per-cluster appset-kagent.yaml, gated only on
          # kagent: "installed", so it deployed to every kagent
          # cluster including k8s01, which has no Prometheus at all).
          - clusters:
              selector:
                matchLabels:
                  prometheus: "installed"
                  kagent: "installed"
          - plugin:
              configMapRef:
                name: argocd-secrets-plugin
              input:
                parameters:
                  secretName: "k8s-clusters-apps-secrets"
  template:
    metadata:
      name: '{{name}}-kagent-prometheus'
    spec:
      project: k8s-homelab-apps
      sources:
      - helm:
          releaseName: kagent-prometheus
          values: |
            controllers:
              main:
                enabled: false
            rawResources:
              prometheus-mcp-server:
                apiVersion: kagent.dev/v1alpha2
                kind: RemoteMCPServer
                forceRename: "prometheus-mcp-server"
                spec:
                  spec:
                    description: Prometheus - PromQL queries, metric/label/series discovery, alerting rules, built-in PromQL docs and runbooks
                    protocol: STREAMABLE_HTTP
                    # Path not documented upstream - confirmed live against
                    # the same convention kagent-grafana-mcp used (also
                    # built on the mark3labs/mcp-go streamable-http server).
                    url: http://prometheus-mcp-prometheus-mcp-server.prometheus-mcp.svc.cluster.local:8080/mcp
                    timeout: 30s
                    sseReadTimeout: 5m0s
                    terminateOnClose: true
              kagent-prometheus:
                apiVersion: kagent.dev/v1alpha2
                kind: Agent
                forceRename: "kagent-prometheus"
                spec:
                  spec:
                    type: Declarative
                    description: "Read-only Prometheus metrics analysis - PromQL queries, metric/label discovery, and alerting state, across all clusters this Prometheus instance monitors"
                    declarative:
                      modelConfig: litellm-model
                      context:
                        compaction:
                          compactionInterval: 5
                          overlapSize: 2
                          tokenThreshold: 31000
                      a2aConfig:
                        skills:
                          - id: analyze-prometheus-metrics
                            name: Analyze Prometheus Metrics
                            description: Query and analyze Prometheus metrics - execute PromQL, discover available metrics/labels/series, check alerting rules.
                            tags:
                              - prometheus
                              - promql
                              - metrics
                              - monitoring
                              - alerting
                            examples:
                              - "What's the GPU utilization on k8s02 right now?"
                              - "Are there any firing alerts?"
                              - "Show me the error rate for the litellm deployment over the last hour."
                            inputModes: ["text"]
                            outputModes: ["text"]
                      systemMessage: |
                        You are a read-only Prometheus metrics analyst,
                        talking directly to this cluster's Prometheus - you
                        cannot modify anything (no config changes, no admin
                        actions).

                        You have a tool called `ask_user`. Never call it,
                        for any reason - not to ask about an optional
                        filter, not to confirm a parameter value, not to
                        ask permission before running a tool, not even if
                        you've already called it earlier in this
                        conversation and are tempted to check in again.
                        If you notice yourself about to call `ask_user`,
                        stop and call the real tool you actually need
                        instead, using your best judgement for any
                        optional parameter (omit it - every optional
                        filter here already treats "not provided" as "no
                        filter, show everything"). The only acceptable
                        way to communicate with the user is your normal
                        text response once you have an actual answer for
                        them.
                        instead.

                        This is a multi-cluster Prometheus: several
                        clusters' metrics are federated into one instance,
                        each series carrying a `cluster` label identifying
                        which cluster it came from. When a question is
                        about a specific cluster, always filter/aggregate
                        by the `cluster` label rather than assuming which
                        clusters exist - if you're not sure what values it
                        takes, query label_values for `cluster` first
                        rather than guessing a name.

                        Workflow: when you don't already know the exact
                        metric name, use metric_metadata / series to find
                        it and understand its type (counter/gauge/
                        histogram) before writing a query - a counter
                        needs rate()/increase(), a gauge doesn't. Use
                        label_names / label_values to discover what a
                        metric can be filtered/grouped by. Use
                        docs_search/docs_read for PromQL syntax questions
                        and runbooks_list/runbooks_read if a metric or
                        alert has an associated runbook, rather than
                        guessing at syntax. Use list_alerts/list_rules for
                        alerting state. You don't have a scrape-target-
                        health tool - if asked about target/scrape
                        health specifically, say so rather than guessing,
                        and suggest checking the `up` metric via query
                        instead (up == 0 means a target is down).

                        Tool usage - keep outputs small: choose a
                        reasonable time range and step for range_query
                        instead of over-fetching; prefer an aggregated
                        query (sum/avg/max by a label) over returning every
                        individual time series when the user asked a
                        summary-level question.

                        Always show the actual PromQL query you ran
                        alongside the result, so the user can verify or
                        reuse it.
              kagent-prometheus-a2a:
                apiVersion: gateway.networking.k8s.io/v1beta1
                kind: HTTPRoute
                forceRename: "kagent-prometheus-a2a"
                spec:
                  spec:
                    parentRefs:
                      - name: cilium-gw
                        namespace: cilium-system
                        group: gateway.networking.k8s.io
                        kind: Gateway
                    # MUST match the cluster's existing kagent-a2a-{{name}}
                    # hostname (see appset-kagent.yaml's
                    # controller.a2aBaseUrl) - not a unique hostname for
                    # this agent. Every Agent a cluster's kagent-controller
                    # hosts self-advertises this same hostname regardless
                    # of what hostname its own HTTPRoute uses - getting
                    # this wrong has broken A2A twice already this project
                    # (see appset-kagent-hub-k8s-cluster.yaml's history).
                    hostnames:
                      - kagent-a2a-{{name}}.{{ domainname }}
                    rules:
                      - backendRefs:
                          - group: ''
                            kind: Service
                            name: kagent-controller
                            namespace: kagent
                            port: 8083
                            weight: 1
                        matches:
                          - path:
                              type: PathPrefix
                              value: /api/a2a/kagent/kagent-prometheus
        repoURL: https://bjw-s-labs.github.io/helm-charts
        chart: app-template
        targetRevision: 4.6.2
      destination:
        server: '{{server}}'
        namespace: kagent
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
