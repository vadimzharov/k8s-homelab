apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: keycloak
  namespace: argocd
  annotations:
    appset-dashboard-appname: "Keycloak"
    appset-dashboard-groupname: "K8S tools"
spec:
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  keycloak: "installed"
          - plugin:
              configMapRef:
                name: argocd-secrets-plugin
              input:
                parameters:
                  secretName: "k8s-clusters-apps-secrets"
  template:
    metadata:
      name: '{{name}}-keycloak'
    spec:
      project: k8s-homelab-apps
      sources:
      - helm:
          releaseName: keycloak
          values: |          
            auth:
              adminUser: {{ keycloakadminuser }}
              adminPassword: {{ keycloakadminpassword }}
            ingress:
              enabled: true
              ingressClassName: '{{metadata.labels.keycloak-ingress}}'
              hostname: keycl.{{ domainname }}
              annotations:
                nginx.ingress.kubernetes.io/proxy-buffering: "on"
                nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
                nginx.ingress.kubernetes.io/proxy-buffer-size: "8k"
            adminIngress:
              enabled: true
              ingressClassName: nginx
              hostname: keycloak.{{ domainname }}
            proxy: edge
            postgresql:
              auth:
                postgresPassword: {{ keycloakadminpassword }}
                username: bn_keycloak
                password: {{ keycloakadminpassword }}
                database: bitnami_keycloak 
              primary:
                nodeSelector:
                  "kubernetes.io/arch": "amd64"
                podSecurityContext:
                  enabled: true
                  fsGroup: 1024
                containerSecurityContext:
                  enabled: true
                  runAsUser: 1024
        repoURL: https://charts.bitnami.com/bitnami
        chart: keycloak
        targetRevision: 19.3.3
      destination:
        server: '{{server}}' 
        namespace: keycloak
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
      