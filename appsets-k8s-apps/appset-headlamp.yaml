apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: headlamp
  namespace: argocd
  annotations:
    appset-dashboard-appname: "Headlamp Kubernetes dashboard"
    appset-dashboard-groupname: "K8S tools"
  labels:
    appset-dashboard-multicluster: "true"
spec:
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  headlamp: "installed"
          - plugin:
              configMapRef:
                name: argocd-secrets-plugin
              input:
                parameters:
                  secretName: "k8s-clusters-apps-secrets"
  template:
    metadata:
      name: '{{name}}-headlamp'
    spec:
      project: k8s-homelab-apps
      sources:
      - helm:
          releaseName: headlamp
          values: |
            config:
              oidc:
                clientID: "kubernetes-api"
                clientSecret: "{{ kubeapiclientsecret }}"
                issuerURL: "https://pocket-id.{{ domainname }}"
                scopes: "email,profile"
            ingress:
              enabled: false
              ingressClassName: "nginx"
              hosts:
                - host: console-{{ name }}.{{ domainname }}
                  paths:
                  - path: /
                    type: ImplementationSpecific
            extraManifests:
              - |
                apiVersion: gateway.networking.k8s.io/v1
                kind: HTTPRoute
                metadata:
                  name: headlamp-route
                  namespace: headlamp
                  labels:
                    k8s-dashboard-group: Dashboards
                    k8s-dashboard-appname: K8S-cluster-{{ name }}
                spec:
                  parentRefs:
                    - name: cilium-gw
                      namespace: cilium-system
                  hostnames:
                    - console-{{ name }}.{{ domainname }}
                  rules:
                    - backendRefs:
                        - group: ''
                          kind: Service
                          name: headlamp
                          namespace: headlamp
                          port: 80
                          weight: 1
                      matches:
                        - path:
                            type: PathPrefix
                            value: /
              - |
                apiVersion: rbac.authorization.k8s.io/v1
                kind: ClusterRoleBinding
                metadata:
                  name: cluster-admins
                roleRef:
                  apiGroup: rbac.authorization.k8s.io
                  kind: ClusterRole
                  name: cluster-admin
                subjects:
                - apiGroup: rbac.authorization.k8s.io
                  kind: User
                  name: {{ adminuseremail }}
        repoURL: https://kubernetes-sigs.github.io/headlamp/
        chart: headlamp
        targetRevision: 0.42.0
      destination:
        server: '{{server}}' 
        namespace: headlamp
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
      