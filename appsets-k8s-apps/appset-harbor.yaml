apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: harbor
  namespace: argocd
  labels:
    appset-dashboard-appname: "Harbor registry (deprecated)"    
spec:
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  harbor: "installed"
          - plugin:
              configMapRef:
                name: argocd-secrets-plugin
              input:
                parameters:
                  secretName: "k8s-clusters-apps-secrets"  
  template:
    metadata:
      name: '{{name}}-harbor'
    spec:
      project: k8s-homelab-apps
      sources:
      - helm:
          releaseName: harbor
          values: |
            expose:
              tls:
                enabled: true
                certSource: none
              ingress:
                hosts:
                  core: harbor.{{ domainname }}
                className: '{{ metadata.labels.harbor-ingress }}'
            externalURL: https://harbor.{{ domainname }}:5000
            logLevel: info
            database:
              type: external
              external:
                host: "postgresql"
                port: "5432"
                username: "{{ harborpgusername }}"
                password: "{{ harborpgpassword }}"
                coreDatabase: "registry"                
        repoURL: https://helm.goharbor.io
        chart: harbor
        targetRevision: 1.14.1
      - helm:
          releaseName: postgresql
          values: |
            global:
              storageClass: "sc-nfs-default"
              postgresql:
                auth:
                  postgresPassword: "{{ harborpgpassword }}"
                  username: "{{ harborpgusername }}"
                  password: "{{ harborpgpassword }}"
                  database: "registry"
            primary:
              containerSecurityContext:
                enabled: true
                seLinuxOptions: {}
                runAsUser: 1024
                runAsGroup: 1024
                runAsNonRoot: true
                privileged: false
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: "RuntimeDefault"            
        repoURL: https://charts.bitnami.com/bitnami
        chart: postgresql
        targetRevision: 15.1.4
      destination:
        server: '{{server}}' 
        namespace: harbor
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
      