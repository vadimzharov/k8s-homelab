apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kagent-hub-k8s-cluster
  namespace: argocd
  annotations:
    ai-agent-inventory-appname: "KAgent Hub K8s Cluster"
    appset-dashboard-appname: "KAgent - Hub cluster agents"
    appset-dashboard-groupname: "AI tools"
    k8s-dashboard-group: "AI tools"
    k8s-dashboard-appname: "KAgent - Hub cluster agents"
spec:
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  k8s-hub-mcp: "installed"
                  kagent: "installed"
          - plugin:
              configMapRef:
                name: argocd-secrets-plugin
              input:
                parameters:
                  secretName: "k8s-clusters-apps-secrets"
  template:
    metadata:
      name: '{{name}}-kagent-hub-k8s-cluster'
    spec:
      project: k8s-homelab-apps
      sources:
      - helm:
          releaseName: kagent-hub-k8s-cluster
          values: |
            controllers:
              main:
                enabled: false
            rawResources:
              k8s-hub-mcp-server:
                apiVersion: kagent.dev/v1alpha2
                kind: RemoteMCPServer
                forceRename: "k8s-hub-mcp-server"
                spec:
                  spec:
                    description: Read-only Kubernetes MCP server targeting the hub/ArgoCD cluster (via mounted kubeconfig, not in-cluster access)
                    protocol: STREAMABLE_HTTP
                    url: http://k8s-hub-mcp-kubernetes-mcp-server.k8s-hub-mcp.svc.cluster.local:8080/mcp
                    timeout: 30s
                    sseReadTimeout: 5m0s
                    terminateOnClose: true
              argocd-mcp-server:
                apiVersion: kagent.dev/v1alpha2
                kind: RemoteMCPServer
                forceRename: "argocd-mcp-server"
                spec:
                  spec:
                    description: ArgoCD - list/get/sync applications, inspect resources, view workload logs and events
                    protocol: STREAMABLE_HTTP
                    url: http://argocd-mcp.argocd-mcp.svc.cluster.local:3000/mcp
                    timeout: 30s
                    sseReadTimeout: 5m0s
                    terminateOnClose: true
              # Split into two single-toolset agents 2026-08-17 - a combined
              # k8s+ArgoCD agent made every query (even simple ones) balloon
              # in context size fast enough to take ~4 minutes on ik-llama,
              # which in turn starved Hermes' Telegram polling loop long
              # enough to drop the connection. Each agent below only carries
              # one MCP toolset, keeping per-turn context (and therefore
              # latency) much smaller.
              kagent-hub-k8s-cluster:
                apiVersion: kagent.dev/v1alpha2
                kind: Agent
                forceRename: "kagent-hub-k8s-cluster"
                spec:
                  spec:
                    type: Declarative
                    description: "Read-only Kubernetes agent for the hub/management cluster (k3s, ARM, no persistent storage) where ArgoCD runs"
                    declarative:
                      modelConfig: litellm-model
                      context:
                        compaction:
                          compactionInterval: 5
                          overlapSize: 2
                          tokenThreshold: 31000
                      a2aConfig:
                        skills:
                          - id: hub-cluster-health-check
                            name: Hub Cluster Health Check
                            description: Inspect pod, deployment, and node status on the hub/management cluster (where ArgoCD runs) to report on overall health.
                            tags: ["kubernetes", "health", "monitoring"]
                            examples:
                              - "Are there any unhealthy pods on the hub cluster?"
                              - "What's the node status on the ArgoCD cluster?"
                            inputModes: ["text"]
                            outputModes: ["text"]
                      systemMessage: |
                        You are a read-only Kubernetes assistant for the
                        hub/management cluster (k3s, ARM, no persistent
                        storage) - the cluster where ArgoCD itself runs. That
                        cluster is separate from the one you're deployed on:
                        you reach its Kubernetes API entirely through a
                        mounted kubeconfig behind a dedicated MCP server, not
                        through this cluster's own API. All tools are
                        strictly read-only, enforced by the MCP server itself
                        (--read-only), not just this prompt - never claim to
                        have made a change.

                        For ArgoCD application/GitOps status questions, say
                        you don't cover that and suggest asking the separate
                        hub-argocd-agent instead - you only have generic
                        Kubernetes tools.

                        Health assessment: pod/deployment status alone is not
                        enough - a pod can show "Running" while still
                        flapping, or its owning controller can be stuck
                        (scheduling failures, image pull errors, failed
                        probes, OOM kills, volume mount issues). Always also
                        check recent Warning-type Kubernetes events for the
                        relevant namespace/resource when assessing health,
                        not just a pod/deployment listing - events often
                        surface the real problem before, or instead of, a
                        visible status change.

                        Tool usage - keep outputs small: always pass a small
                        tail_lines for logs, prefer wide/json output over
                        yaml, avoid unscoped all-namespaces + unfiltered
                        resource-type combinations, narrow then drill in
                        instead of fetch-everything-then-filter. Scope events
                        to a namespace or resource rather than fetching
                        cluster-wide events unscoped.
                      tools:
                        - type: McpServer
                          mcpServer:
                            apiGroup: kagent.dev
                            kind: RemoteMCPServer
                            name: k8s-hub-mcp-server
                            namespace: kagent
              kagent-hub-argocd:
                apiVersion: kagent.dev/v1alpha2
                kind: Agent
                forceRename: "kagent-hub-argocd"
                spec:
                  spec:
                    type: Declarative
                    description: "Read-only ArgoCD agent - application sync status, health, and deployment history across the homelab"
                    declarative:
                      modelConfig: litellm-model
                      context:
                        compaction:
                          compactionInterval: 5
                          overlapSize: 2
                          tokenThreshold: 31000
                      a2aConfig:
                        skills:
                          - id: argocd-application-status
                            name: ArgoCD Application Status
                            description: List and inspect ArgoCD Applications - sync status, health status, and recent sync history across the homelab.
                            tags: ["argocd", "gitops", "deployments"]
                            examples:
                              - "Are all ArgoCD applications synced and healthy?"
                              - "What's the status of the litellm ArgoCD application?"
                            inputModes: ["text"]
                            outputModes: ["text"]
                      systemMessage: |
                        You are a read-only ArgoCD assistant. You have
                        ArgoCD-specific tools only (list/get applications,
                        inspect resources, view workload logs and events,
                        sync status and history) - you do not have generic
                        Kubernetes tools.

                        For general Kubernetes/node/pod health questions not
                        tied to an ArgoCD Application, say you don't cover
                        that and suggest asking the separate
                        hub-k8s-cluster-agent instead.

                        Tool usage - keep outputs small: prefer a compact
                        list/status view (name, sync status, health status)
                        over fetching full Application manifests or detailed
                        resource trees - only pull full detail once you've
                        narrowed to a specific application that needs it.
                        For a broad question ("are all apps synced", "how
                        many are OutOfSync") list applications once and
                        summarize from that response rather than getting
                        each application individually. Scope to a specific
                        application/namespace when you already know roughly
                        where the problem is. Avoid fetching logs/events for
                        every resource in an application - drill into the
                        specific failing resource instead.
                      tools:
                        - type: McpServer
                          mcpServer:
                            apiGroup: kagent.dev
                            kind: RemoteMCPServer
                            name: argocd-mcp-server
                            namespace: kagent
              kagent-hub-k8s-cluster-a2a:
                apiVersion: gateway.networking.k8s.io/v1beta1
                kind: HTTPRoute
                forceRename: "kagent-hub-k8s-cluster-a2a"
                spec:
                  spec:
                    parentRefs:
                      - name: cilium-gw
                        namespace: cilium-system
                        group: gateway.networking.k8s.io
                        kind: Gateway
                    # MUST match the cluster's existing kagent-a2a-{{name}}
                    # hostname (see appset-kagent.yaml's controller.a2aBaseUrl)
                    # - not a unique hostname for this agent. a2aBaseUrl is
                    # set once per kagent-controller install and applies to
                    # every agent it hosts, so this agent's card always
                    # self-advertises kagent-a2a-{{name}}, regardless of what
                    # hostname this HTTPRoute itself uses. A distinct
                    # hostname here was tried first and broke A2A entirely
                    # (LiteLLM/Hermes follow the card's self-declared url,
                    # not this route) - confirmed live 2026-08-16.
                    hostnames:
                      - kagent-a2a-{{name}}.{{ domainname }}
                    rules:
                      - backendRefs:
                          - group: ''
                            kind: Service
                            name: kagent-controller
                            namespace: kagent
                            port: 8083
                            weight: 1
                        matches:
                          - path:
                              type: PathPrefix
                              value: /api/a2a/kagent/kagent-hub-k8s-cluster
              kagent-hub-argocd-a2a:
                apiVersion: gateway.networking.k8s.io/v1beta1
                kind: HTTPRoute
                forceRename: "kagent-hub-argocd-a2a"
                spec:
                  spec:
                    parentRefs:
                      - name: cilium-gw
                        namespace: cilium-system
                        group: gateway.networking.k8s.io
                        kind: Gateway
                    # Same hostname as kagent-hub-k8s-cluster-a2a above -
                    # see that route's comment for why. Two HTTPRoutes can
                    # share one hostname as long as their path prefixes
                    # don't overlap (Gateway API routes by path within a
                    # shared hostname).
                    hostnames:
                      - kagent-a2a-{{name}}.{{ domainname }}
                    rules:
                      - backendRefs:
                          - group: ''
                            kind: Service
                            name: kagent-controller
                            namespace: kagent
                            port: 8083
                            weight: 1
                        matches:
                          - path:
                              type: PathPrefix
                              value: /api/a2a/kagent/kagent-hub-argocd
        repoURL: https://bjw-s-labs.github.io/helm-charts
        chart: app-template
        targetRevision: 4.6.2
      destination:
        server: '{{server}}'
        namespace: kagent
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
