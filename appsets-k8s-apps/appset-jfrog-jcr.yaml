apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: jfrog-jcr
  namespace: argocd
  annotations:
    ai-agent-inventory-appname: "JFrog Artifactory"
    appset-dashboard-appname: "JFrog JCR"
    appset-dashboard-groupname: "K8S tools"  
spec:
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  jfrog-jcr: "installed"
          - plugin:
              configMapRef:
                name: argocd-secrets-plugin
              input:
                parameters:
                  secretName: "k8s-clusters-apps-secrets"
  template:
    metadata:
      name: '{{name}}-jfrog-jcr'
    spec:
      project: k8s-homelab-apps
      sources:
      - helm:
          releaseName: jfrog-jcr
          values: |
            artifactory:
              artifactory:
                masterKey: {{ jfrogmasterkey }}
                joinKey: {{ jfrogjoinkey }}
              persistence:
                enabled: true
                storageClassName: synas-csi-delete
                accessMode: ReadWriteOnce
                size: 100Gi                

              postgresql:
                auth:
                  password: "{{harborpgpassword}}"
                primary:
                  persistence:
                    enabled: true
                    storageClass: synas-csi-delete
                    size: 20Gi                  

              ingress:
                enabled: false
              nginx:
                enabled: false

              artifactory:
                service:
                  type: ClusterIP          

        repoURL: https://charts.jfrog.io
        chart: artifactory-jcr
        targetRevision: 107.133.17
      destination:
        server: '{{server}}' 
        namespace: jfrog-jcr
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
      