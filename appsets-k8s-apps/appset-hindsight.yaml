apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: hindsight
  namespace: argocd
  annotations:
    ai-agent-inventory-appname: "Hindsight"
    appset-dashboard-appname: "Hindsight"
    appset-dashboard-groupname: "AI tools"
spec:
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  hindsight: "installed"
          - plugin:
              configMapRef:
                name: argocd-secrets-plugin
              input:
                parameters:
                  secretName: "k8s-clusters-apps-secrets"
  template:
    metadata:
      name: '{{name}}-hindsight'
    spec:
      project: k8s-homelab-apps
      sources:
      # CNPG Postgres + backup infra for Hindsight. PHASE 1 (this file, as
      # committed): bootstrap.initdb, backup plugin wired from the start.
      # See k8s-ai-homelab docs/24 for the full rollout sequence - once a
      # verified backup exists and this Cluster object is deleted, this
      # block gets hand-edited to bootstrap.recovery (PHASE 2), same
      # cluster name, before the label is re-applied.
      - helm:
          releaseName: hindsight-db
          values: |
            controllers:
              main:
                enabled: false
            rawResources:
              minio-credentials:
                apiVersion: v1
                kind: Secret
                forceRename: "minio-credentials"
                spec:
                  stringData:
                    accesskey: {{ miniokey }}
                    secretkey: {{ miniosecretkey }}
              hindsightsecrets:
                apiVersion: v1
                kind: Secret
                forceRename: "hindsight-secrets"
                spec:
                  stringData:
                    # username/password: consumed by CNPG's
                    # bootstrap.initdb.secret below. postgres-password:
                    # the fixed key name Hindsight's chart reads via
                    # existingSecret (templates/api-deployment.yaml) -
                    # same value, duplicated under both key names so one
                    # Secret satisfies both consumers. See docs/24 for
                    # why this can't just be CNPG's own auto-generated
                    # <cluster>-app secret (different key name, and no
                    # live-cluster read-back under ArgoCD anyway).
                    username: hindsight
                    password: {{ hindsight-db-password }}
                    postgres-password: {{ hindsight-db-password }}
                    # Everything below is here, not under api.secrets/
                    # controlPlane.secrets in the hindsight release's own
                    # values, because api-deployment.yaml/
                    # controlplane-deployment.yaml only render
                    # api.secrets/controlPlane.secrets when
                    # existingSecret is UNSET - confirmed in the chart
                    # source. Since we set existingSecret (for
                    # postgres-password above), those values would be
                    # silently dropped; envFrom on this same Secret is
                    # what actually delivers them instead. Harmless
                    # cross-pollination: api and controlPlane both get
                    # envFrom'd the full secret, so each also receives a
                    # few unused keys meant for the other/for CNPG.
                    HINDSIGHT_API_LLM_BASE_URL: "http://litellm.litellm.svc.cluster.local:4000/v1"
                    HINDSIGHT_API_LLM_API_KEY: {{ hindsight-litellm-key }}
                    # Enables HINDSIGHT_API_TENANT_EXTENSION (api.env
                    # below) - one shared key gating the whole API
                    # (bank_id isolation is still just a data boundary,
                    # not per-bank auth). CP_DATAPLANE_API_KEY must be
                    # the same value: it's the bearer token the Control
                    # Plane sends to the now-protected API.
                    HINDSIGHT_API_TENANT_API_KEY: {{ hindsight-api-key }}
                    HINDSIGHT_CP_DATAPLANE_API_KEY: {{ hindsight-api-key }}
              backupobjectstore:
                apiVersion: barmancloud.cnpg.io/v1
                kind: ObjectStore
                forceRename: "hindsight-db-backup"
                spec:
                  spec:
                    retentionPolicy: "5d"
                    configuration:
                      # Dedicated bucket, not a shared-bucket subpath like
                      # litellm-db uses (s3://cloudnative-pg-backups/
                      # litellm-db) - user created
                      # cloudnative-pg-hindsight-backup specifically for
                      # this.
                      destinationPath: s3://cloudnative-pg-hindsight-backup
                      endpointURL: http://{{ minioendpoint }}
                      s3Credentials:
                        accessKeyId:
                          name: minio-credentials
                          key: accesskey
                        secretAccessKey:
                          name: minio-credentials
                          key: secretkey
                      wal:
                        compression: gzip
              scheduledbackup:
                apiVersion: postgresql.cnpg.io/v1
                kind: ScheduledBackup
                forceRename: hindsight-db-backup
                spec:
                  spec:
                    schedule: "0 0/30 * * * *"
                    backupOwnerReference: self
                    cluster:
                      name: hindsight-db
                    method: plugin
                    pluginConfiguration:
                      name: barman-cloud.cloudnative-pg.io
              pgvectorcatalog:
                apiVersion: postgresql.cnpg.io/v1
                kind: ImageCatalog
                forceRename: "hindsight-pgvector"
                spec:
                  spec:
                    images:
                    - major: 16
                      image: pgvector/pgvector:0.8.6-pg16-bookworm
              pgsqlcluster:
                apiVersion: postgresql.cnpg.io/v1
                kind: Cluster
                forceRename: "hindsight-db"
                annotations:
                  cnpg.io/skipEmptyWalArchiveCheck: "enabled"
                spec:
                  spec:
                    instances: 1

                    storage:
                      size: 8Gi
                      storageClass: synas-csi-delete

                    # PHASE 1: fresh DB. PHASE 2 (after a verified backup
                    # and deleting this Cluster object): replace this
                    # bootstrap block with
                    #   bootstrap:
                    #     recovery:
                    #       source: origin
                    #       database: hindsight
                    #       owner: hindsight
                    #   externalClusters:
                    #     - name: origin
                    #       plugin:
                    #         name: barman-cloud.cloudnative-pg.io
                    #         parameters:
                    #           barmanObjectName: hindsight-db-backup
                    #           serverName: hindsight-db
                    # (same shape as litellm-db's live Cluster in this
                    # same repo - self-referential serverName because the
                    # backups being restored were archived under this
                    # same cluster name.)
                    bootstrap:
                      initdb:
                        database: hindsight
                        owner: hindsight
                        secret:
                          name: hindsight-secrets

                    # Not the plain ghcr.io/cloudnative-pg/postgresql image
                    # (what litellm-db uses) - Hindsight requires the
                    # pgvector extension (confirmed live: API pod crashed
                    # on first boot with "pgvector extension is required
                    # but not installed"), which that image doesn't
                    # include. pgvector/pgvector:pg16 is built FROM
                    # postgres:16-bookworm (same official Debian base
                    # CNPG's own images use, confirmed from its
                    # Dockerfile), so it's layout-compatible - just with
                    # pgvector compiled in.
                    #
                    # imageCatalogRef, not a plain imageName: also
                    # confirmed live - CNPG's admission webhook rejects
                    # "pgvector/pgvector:0.8.6-pg16-bookworm" as an
                    # imageName ("can't downgrade from major 16 to 0"),
                    # because its version-detection heuristic parses the
                    # tag's leading "0.8.6" (pgvector's own version) as
                    # the PostgreSQL major version instead of the
                    # embedded "pg16". The ImageCatalog rawResource above
                    # sidesteps that entirely by declaring the major
                    # version explicitly instead of asking CNPG to infer
                    # it from the tag string.
                    imageCatalogRef:
                      apiGroup: postgresql.cnpg.io
                      kind: ImageCatalog
                      name: hindsight-pgvector
                      major: 16

                    plugins:
                    - name: barman-cloud.cloudnative-pg.io
                      isWALArchiver: true
                      parameters:
                        barmanObjectName: hindsight-db-backup
        repoURL: https://bjw-s-labs.github.io/helm-charts
        chart: app-template
        targetRevision: 4.4.0
      - helm:
          releaseName: hindsight
          values: |
            # hindsight-secrets (rawResource in the CNPG source above)
            # serves CNPG (username/password), this chart's DB password
            # (postgres-password, read via an explicit secretKeyRef -
            # confirmed in templates/api-deployment.yaml), and the LLM/
            # tenant-auth keys below (read via envFrom instead, since
            # api.secrets/controlPlane.secrets are silently ignored by
            # the chart whenever existingSecret is set - see the
            # rawResource's own comment). One Secret, every consumer.
            existingSecret: "hindsight-secrets"

            postgresql:
              enabled: false
              external:
                host: hindsight-db-rw.hindsight.svc.cluster.local
                port: 5432
                database: hindsight
                username: hindsight

            api:
              env:
                HINDSIGHT_API_LLM_PROVIDER: "openai"
                # "onprem" is a LiteLLM auto-router alias (docs/24), not a
                # real model_list entry - swapping which self-hosted
                # model backs it in LiteLLM (e.g. off qwen3.6-27b onto
                # whatever replaces it later) needs no change here.
                HINDSIGHT_API_LLM_MODEL: "onprem"
                # By default Hindsight runs with no auth at all. This
                # turns on the built-in API-key tenant extension -
                # HINDSIGHT_API_TENANT_API_KEY (in hindsight-secrets
                # above) is then required as `Authorization: Bearer
                # <key>` on every request, 401 otherwise.
                HINDSIGHT_API_TENANT_EXTENSION: "hindsight_api.extensions.builtin.tenant:ApiKeyTenantExtension"

            # No Ingress, no HTTPRoute. Hermes (k8s02, same cluster) is
            # the only consumer and is the sole reason this exists -
            # its native Hindsight memory provider (REST API + pre/
            # post_llm_call hooks for auto-recall/auto-retain) talks to
            # the api Service directly, in-cluster. Confirmed Hermes has
            # no MCP-based Hindsight integration to weigh against this -
            # the native provider is REST-only, and is what gives the
            # automatic hooks (a generic MCP connection would only
            # expose the three explicit tools, no auto-recall/retain).
            # Revisit exposure only if a concrete non-Hermes consumer
            # shows up - see docs/24.
            ingress:
              enabled: false
        repoURL: oci://ghcr.io/vectorize-io/charts/hindsight
        targetRevision: 0.9.2
        path: .
      destination:
        server: '{{server}}'
        namespace: hindsight
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
