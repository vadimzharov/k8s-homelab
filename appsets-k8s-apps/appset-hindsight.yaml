apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: hindsight
  namespace: argocd
  annotations:
    ai-agent-inventory-appname: "Hindsight"
    appset-dashboard-appname: "Hindsight"
    appset-dashboard-groupname: "AI tools"
spec:
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  hindsight: "installed"
          - plugin:
              configMapRef:
                name: argocd-secrets-plugin
              input:
                parameters:
                  secretName: "k8s-clusters-apps-secrets"
  template:
    metadata:
      name: '{{name}}-hindsight'
    spec:
      project: k8s-homelab-apps
      sources:
      # CNPG Postgres + backup infra for Hindsight. Now in PHASE 2:
      # bootstrap.recovery, restoring from the barman-cloud backups
      # written during phase 1's bootstrap.initdb run. See k8s-ai-homelab
      # docs/24 for the full rollout sequence and why the flip needed
      # deleting and recreating this Cluster object rather than an
      # in-place edit.
      - helm:
          releaseName: hindsight-db
          values: |
            controllers:
              main:
                enabled: false
            rawResources:
              minio-credentials:
                apiVersion: v1
                kind: Secret
                forceRename: "minio-credentials"
                spec:
                  stringData:
                    accesskey: {{ miniokey }}
                    secretkey: {{ miniosecretkey }}
              hindsightsecrets:
                apiVersion: v1
                kind: Secret
                forceRename: "hindsight-secrets"
                spec:
                  stringData:
                    # username/password: consumed by CNPG's
                    # bootstrap.initdb.secret below. postgres-password:
                    # the fixed key name Hindsight's chart reads via
                    # existingSecret (templates/api-deployment.yaml) -
                    # same value, duplicated under both key names so one
                    # Secret satisfies both consumers. See docs/24 for
                    # why this can't just be CNPG's own auto-generated
                    # <cluster>-app secret (different key name, and no
                    # live-cluster read-back under ArgoCD anyway).
                    username: hindsight
                    password: {{ hindsight-db-password }}
                    postgres-password: {{ hindsight-db-password }}
                    # Everything below is here, not under api.secrets/
                    # controlPlane.secrets in the hindsight release's own
                    # values, because api-deployment.yaml/
                    # controlplane-deployment.yaml only render
                    # api.secrets/controlPlane.secrets when
                    # existingSecret is UNSET - confirmed in the chart
                    # source. Since we set existingSecret (for
                    # postgres-password above), those values would be
                    # silently dropped; envFrom on this same Secret is
                    # what actually delivers them instead. Harmless
                    # cross-pollination: api and controlPlane both get
                    # envFrom'd the full secret, so each also receives a
                    # few unused keys meant for the other/for CNPG.
                    HINDSIGHT_API_LLM_BASE_URL: "http://litellm.litellm.svc.cluster.local:4000/v1"
                    HINDSIGHT_API_LLM_API_KEY: {{ hindsight-litellm-key }}
                    # Enables HINDSIGHT_API_TENANT_EXTENSION (api.env
                    # below) - one shared key gating the whole API
                    # (bank_id isolation is still just a data boundary,
                    # not per-bank auth). CP_DATAPLANE_API_KEY must be
                    # the same value: it's the bearer token the Control
                    # Plane sends to the now-protected API.
                    HINDSIGHT_API_TENANT_API_KEY: {{ hindsight-api-key }}
                    HINDSIGHT_CP_DATAPLANE_API_KEY: {{ hindsight-api-key }}
                    # Gates the Control Plane's own login (separate from
                    # the API's tenant key above) - needed now that the
                    # dashboard has an external HTTPRoute (see
                    # extraResources-equivalent rawResource below), since
                    # this key defaults to unset/disabled otherwise.
                    HINDSIGHT_CP_ACCESS_KEY: {{ hindsight-cp-access-key }}
              backupobjectstore:
                apiVersion: barmancloud.cnpg.io/v1
                kind: ObjectStore
                forceRename: "hindsight-db-backup"
                spec:
                  spec:
                    retentionPolicy: "5d"
                    configuration:
                      # Dedicated bucket, not a shared-bucket subpath like
                      # litellm-db uses (s3://cloudnative-pg-backups/
                      # litellm-db) - user created
                      # cloudnative-pg-hindsight-backup specifically for
                      # this.
                      destinationPath: s3://cloudnative-pg-hindsight-backup
                      endpointURL: http://{{ minioendpoint }}
                      s3Credentials:
                        accessKeyId:
                          name: minio-credentials
                          key: accesskey
                        secretAccessKey:
                          name: minio-credentials
                          key: secretkey
                      wal:
                        compression: gzip
              scheduledbackup:
                apiVersion: postgresql.cnpg.io/v1
                kind: ScheduledBackup
                forceRename: hindsight-db-backup
                spec:
                  spec:
                    schedule: "0 0/30 * * * *"
                    backupOwnerReference: self
                    cluster:
                      name: hindsight-db
                    method: plugin
                    pluginConfiguration:
                      name: barman-cloud.cloudnative-pg.io
              pgsqlcluster:
                apiVersion: postgresql.cnpg.io/v1
                kind: Cluster
                forceRename: "hindsight-db"
                annotations:
                  cnpg.io/skipEmptyWalArchiveCheck: "enabled"
                spec:
                  spec:
                    instances: 1

                    storage:
                      size: 8Gi
                      storageClass: synas-csi-delete

                    # PHASE 2 (flipped 2026-09-06, after 24 consecutive
                    # completed ScheduledBackups over ~11h with zero
                    # failures - see docs/24's rollout-sequence status).
                    # This Cluster object was deleted first (CNPG's
                    # spec.bootstrap is immutable on a live object) and
                    # recreated fresh with this block - same shape as
                    # litellm-db's live Cluster in this same repo,
                    # self-referential serverName because the backups
                    # being restored were archived under this same
                    # cluster name. Every future label-off/label-on
                    # cycle now restores from the latest backup instead
                    # of bootstrapping empty.
                    bootstrap:
                      recovery:
                        source: origin
                        database: hindsight
                        owner: hindsight
                    externalClusters:
                      - name: origin
                        plugin:
                          name: barman-cloud.cloudnative-pg.io
                          parameters:
                            barmanObjectName: hindsight-db-backup
                            serverName: hindsight-db

                    # PG18, not 16 (unlike litellm-db) - see the
                    # postgresql.extensions block below for why.
                    imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-bookworm

                    # Two earlier attempts at pgvector both failed live
                    # before landing on this:
                    #   1. Plain ghcr.io/cloudnative-pg/postgresql image
                    #      (what litellm-db uses, no pgvector) - API pod
                    #      crashed on first boot: "pgvector extension is
                    #      required but not installed".
                    #   2. pgvector/pgvector:0.8.6-pg16-bookworm as
                    #      imageName (even via imageCatalogRef to dodge
                    #      CNPG's tag-version-parsing rejection) - initdb
                    #      crashed: "could not look up effective user ID
                    #      26: user does not exist". CNPG's instance
                    #      manager hardcodes UID 26 for the postgres
                    #      process; that image is built FROM Debian's
                    #      official postgres:16-bookworm, whose postgres
                    #      user is UID 999, not 26 - so it's layout-
                    #      compatible for a plain container but not
                    #      CNPG-compatible specifically.
                    # This is CNPG's own official mechanism instead:
                    # ghcr.io/cloudnative-pg/pgvector, from
                    # github.com/cloudnative-pg/postgres-extensions-containers,
                    # mounted into the (UID-26-correct) base image via
                    # Kubernetes' ImageVolume feature - no custom base
                    # image, no UID mismatch possible. Only published for
                    # major 18, not 16 (checked the registry directly,
                    # no -16- tag exists) - fine here since this is a
                    # brand new, independent database with no version
                    # tie to litellm-db.
                    postgresql:
                      extensions:
                      - name: pgvector
                        image:
                          reference: ghcr.io/cloudnative-pg/pgvector:0.8.6-18-bookworm

                    plugins:
                    - name: barman-cloud.cloudnative-pg.io
                      isWALArchiver: true
                      parameters:
                        barmanObjectName: hindsight-db-backup
              hindsightdatabase:
                # Declarative counterpart to the postgresql.extensions
                # image above: that mounts the pgvector .so/control files
                # into the instance, this actually runs `CREATE EXTENSION
                # vector` inside the target database. Same database name
                # bootstrap.initdb already created - confirmed this is
                # the documented pattern (cloudnative-pg/
                # postgres-extensions-containers' own pgvector README
                # example does the same against its bootstrap-created
                # "app" database), not a conflicting second creation.
                apiVersion: postgresql.cnpg.io/v1
                kind: Database
                forceRename: "hindsight-db-app"
                spec:
                  spec:
                    name: hindsight
                    owner: hindsight
                    cluster:
                      name: hindsight-db
                    extensions:
                    - name: vector
                      version: "0.8.6"
              controlplaneroute:
                # Temporary, for-testing exposure of the dashboard only -
                # the api Service stays ClusterIP-only (see the ingress:
                # enabled: false comment in the hindsight release's own
                # values below for why). Not a chart-native
                # extraResources field like litellm-helm has (Hindsight's
                # chart doesn't offer one) - added here via app-template
                # instead, same trick as the CNPG resources above.
                apiVersion: gateway.networking.k8s.io/v1
                kind: HTTPRoute
                forceRename: "hindsight"
                annotations:
                  k8s-dashboard-group: AI tools
                  k8s-dashboard-appname: Hindsight
                spec:
                  spec:
                    parentRefs:
                      - name: "cilium-gw"
                        namespace: "cilium-system"
                    hostnames:
                      - "hindsight.{{ domainname }}"
                    rules:
                      - backendRefs:
                          - name: hindsight-control-plane
                            port: 3000
        repoURL: https://bjw-s-labs.github.io/helm-charts
        chart: app-template
        targetRevision: 4.4.0
      - helm:
          releaseName: hindsight
          values: |
            # hindsight-secrets (rawResource in the CNPG source above)
            # serves CNPG (username/password), this chart's DB password
            # (postgres-password, read via an explicit secretKeyRef -
            # confirmed in templates/api-deployment.yaml), and the LLM/
            # tenant-auth keys below (read via envFrom instead, since
            # api.secrets/controlPlane.secrets are silently ignored by
            # the chart whenever existingSecret is set - see the
            # rawResource's own comment). One Secret, every consumer.
            existingSecret: "hindsight-secrets"

            postgresql:
              enabled: false
              external:
                host: hindsight-db-rw.hindsight.svc.cluster.local
                port: 5432
                database: hindsight
                username: hindsight

            api:
              env:
                HINDSIGHT_API_LLM_PROVIDER: "openai"
                # "onprem" is a LiteLLM auto-router alias (docs/24), not a
                # real model_list entry - swapping which self-hosted
                # model backs it in LiteLLM (e.g. off qwen3.6-27b onto
                # whatever replaces it later) needs no change here.
                HINDSIGHT_API_LLM_MODEL: "onprem"
                # By default Hindsight runs with no auth at all. This
                # turns on the built-in API-key tenant extension -
                # HINDSIGHT_API_TENANT_API_KEY (in hindsight-secrets
                # above) is then required as `Authorization: Bearer
                # <key>` on every request, 401 otherwise.
                HINDSIGHT_API_TENANT_EXTENSION: "hindsight_api.extensions.builtin.tenant:ApiKeyTenantExtension"
                # Confirmed live: without this, the worker id defaults to
                # the pod hostname, which changes on every pod
                # recreation - any task still "processing" under a dead
                # worker id at that point never gets reclaimed. A fixed
                # string is fine since api.replicaCount stays at 1
                # (worker.enabled: false, no dedicated worker pods to
                # collide with).
                HINDSIGHT_API_WORKER_ID: "hindsight-api"

            # No chart-native Ingress - the dashboard's temporary,
            # for-testing HTTPRoute is added via the app-template
            # rawResource above instead (controlplaneroute), same reason
            # litellm uses a hand-rolled HTTPRoute over this chart's own
            # ingress.yaml. api stays ClusterIP-only regardless: Hermes
            # (k8s02, same cluster) is the only API consumer, via its
            # native REST-only memory provider (pre/post_llm_call hooks
            # for auto-recall/auto-retain) - confirmed no MCP-based
            # Hermes+Hindsight integration exists to weigh against this,
            # and MCP wouldn't get the automatic hooks anyway. See docs/24.
            ingress:
              enabled: false
        repoURL: oci://ghcr.io/vectorize-io/charts/hindsight
        targetRevision: 0.9.2
        path: .
      destination:
        server: '{{server}}'
        namespace: hindsight
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
