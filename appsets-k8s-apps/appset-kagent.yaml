apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kagent
  namespace: argocd
  annotations:
    appset-dashboard-appname: "KAgent - AI for K8S"
    appset-dashboard-groupname: "AI tools"
  labels:
    appset-dashboard-multicluster: "true"    
spec:
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  kagent: "installed"
          - plugin:
              configMapRef:
                name: argocd-secrets-plugin
              input:
                parameters:
                  secretName: "k8s-clusters-apps-secrets"  
  template:
    metadata:
      name: '{{name}}-kagent'
    spec:
      project: k8s-homelab-apps
      sources:
      - helm:
          releaseName: kagent-crd
          parameters:
            - name: crds.enabled
              value: "true"          
        repoURL: oci://ghcr.io/kagent-dev/kagent/helm/kagent-crds
        targetRevision: 0.9.12
        path: .
      - helm:
          releaseName: kagent
          values: |
            providers:
              default: openAI
              openAI:
                model: gpt-5-mini
                apiKey: "{{openai-api-key}}"
            database:
              postgres:
                bundled:
                  enabled: true
                  storage: 5Gi
                  storageClassName: synas-csi-retain
            controller:
              # Without this, kagent advertises its A2A agent-card `url` /
              # `supportedInterfaces[].url` as the in-cluster Service DNS
              # name (http://<fullname>-controller.<namespace>.svc.cluster.local:8083/...),
              # which is IDENTICAL across every cluster running this same
              # appset. A2A clients (e.g. LiteLLM's agent gateway) follow
              # that self-declared URL for the actual message-send call,
              # not the discovery URL they were originally configured
              # with - so any client living inside one of these clusters
              # (like LiteLLM, which runs on k8s02) resolves that hostname
              # to ITS OWN cluster's kagent-controller, silently
              # cross-wiring every "k8s01" A2A call to k8s02's agent
              # instead. Confirmed via live agent-card.json inspection and
              # a direct curl test on 2026-08-15. Setting this to the real,
              # externally-reachable HTTPRoute hostname (see the
              # k8s-agent-litellm-a2a HTTPRoute below) makes each
              # cluster's agent card advertise a URL only ITS OWN cluster
              # can be correctly reached at.
              a2aBaseUrl: "https://kagent-a2a-{{name}}.{{ domainname }}"
            kgateway-agent:
              enabled: false
            istio-agent:
              enabled: false
            promql-agent:
              enabled: false
            observability-agent:
              # The bundled Agent, not used - its toolNames list is baked
              # directly into its chart template with no override point
              # (checked directly), so it can't be trimmed. kagent-observability
              # below is a hand-written Agent instead, using only the
              # grafana-mcp tool server this enables.
              enabled: false
            grafana-mcp:
              enabled: true
              grafana:
                # Our Grafana runs in its own namespace via a separate
                # appset (appset-grafana.yaml), not in kagent - the chart's
                # default (grafana.kagent:3000/api) is wrong for this
                # setup on BOTH counts: wrong host, and upstream
                # mcp-grafana's own docs are explicit that GRAFANA_URL
                # should be the bare host with no /api suffix (its client
                # appends that itself) - confirmed live 2026-08-22: with
                # /api included, list_datasources 404'd ("GET /datasources"
                # in the error - the client's own basePath logic doesn't
                # expect a path segment already in the host), even though
                # other tools (query_prometheus) tolerated it fine.
                url: "http://grafana.grafana.svc.cluster.local"
                # Populated by the bootstrap Job in
                # appset-kagent-grafana-mcp-bootstrap.yaml - Grafana has no
                # declarative way to create service-account tokens, so that
                # Job mints one from Grafana's own admin credentials and
                # writes it here. Setting secretRef (rather than leaving it
                # unset) makes this subchart skip creating its own empty
                # Secret, so it doesn't fight the bootstrap Job over
                # ownership of the same object.
                secretRef: "kagent-grafana-mcp-sa-token"
              # mcp-grafana v0.17.1+ added DNS-rebinding protection: it
              # rejects any request whose Host header isn't in an
              # allowlist (defaults to localhost/127.0.0.1 only), which
              # made kagent-controller's own calls fail with a 403
              # ("Forbidden") - confirmed live 2026-08-21, zero requests
              # ever reached this pod's own logs, consistent with a
              # rejection before the app layer. This server is internal-
              # only (ClusterIP, no ingress) - same trust model as
              # argocd-mcp/k8s-hub-mcp, which have no auth at all because
              # the network boundary is the real security boundary here -
              # so disabling the check entirely is consistent with how
              # every other internal MCP server in this repo is treated.
              args:
                - "--allowed-hosts=*"
            argo-rollouts-agent:
              enabled: false
            helm-agent:
              enabled: false
            cilium-policy-agent:
              enabled: false
            cilium-manager-agent:
              enabled: false
            cilium-debug-agent:
              enabled: false
        repoURL: oci://ghcr.io/kagent-dev/kagent/helm/kagent
        targetRevision: 0.9.12
        path: .
      - helm:
          releaseName: kagent-httproute
          values: |
            controllers: 
              main:
               enabled: false
            rawResources:
              kagent-httproute:
                apiVersion: gateway.networking.k8s.io/v1beta1
                kind: HTTPRoute
                annotations:
                  k8s-dashboard-group: AI tools
                  k8s-dashboard-appname: KAgent - AI for K8S
                spec:
                  spec:
                    parentRefs:
                      - name: cilium-gw
                        namespace: cilium-system
                        group: gateway.networking.k8s.io
                        kind: Gateway
                    hostnames:
                      - kagent-{{name}}.{{ domainname }}
                    rules:
                      - backendRefs:
                          - group: ''
                            kind: Service
                            name: kagent-ui
                            namespace: kagent
                            port: 8080
                            weight: 1
                        matches:
                          - path:
                              type: PathPrefix
                              value: /
              # LiteLLM-backed ModelConfig + Agent - previously applied
              # directly on the cluster (not GitOps-managed), now brought
              # into this appset via rawResources rather than a plain
              # manifest path in this git repo, per explicit direction.
              # This is deliberately a SEPARATE agent from the bundled
              # `k8s-agent` (OpenAI-backed, kept as-is as a backup/fallback
              # agent, not touched here) - k8s-agent-litellm is the one
              # intended for A2A registration with the planned Hermes/
              # cross-cluster agent setup; k8s-agent is explicitly NOT to
              # be registered there.
              litellm-creds:
                apiVersion: v1
                kind: Secret
                forceRename: "litellm-creds"
                spec:
                  stringData:
                    PROVIDER_API_KEY: {{litellm-kagent-key}}
              litellm-model:
                apiVersion: kagent.dev/v1alpha2
                kind: ModelConfig
                forceRename: "litellm-model"
                spec:
                  spec:
                    apiKeySecret: litellm-creds
                    apiKeySecretKey: PROVIDER_API_KEY
                    model: qwen3.6-27b
                    openAI:
                      baseUrl: https://litellm.{{ domainname }}/v1
                    provider: OpenAI
              k8s-agent-litellm:
                apiVersion: kagent.dev/v1alpha2
                kind: Agent
                forceRename: "k8s-agent-litellm"
                spec:
                  spec:
                    declarative:
                      context:
                        compaction:
                          compactionInterval: 5
                          overlapSize: 2
                          tokenThreshold: 31000
                      # Serves this agent over A2A at
                      # <kagent-controller>:8083/api/a2a/kagent/k8s-agent-litellm/
                      # - exposed externally via the k8s-agent-litellm-a2a
                      # HTTPRoute below, for registration in LiteLLM's A2A
                      # gateway (planned Hermes integration). Skills are
                      # scoped to match this agent's actual (read-only)
                      # toolset - no skill implies write/mutate capability,
                      # since that access was deliberately removed above.
                      a2aConfig:
                        skills:
                          - id: cluster-health-check
                            name: "Cluster Health Check"
                            description: "Inspect pod, deployment, and node status across the cluster to report on overall health and surface problems (e.g. CrashLoopBackOff, pending pods, failed rollouts)."
                            tags:
                              - kubernetes
                              - health
                              - monitoring
                            examples:
                              - "Are there any unhealthy pods in the cluster?"
                              - "What's the status of the litellm deployment?"
                          - id: resource-inspection
                            name: "Resource Inspection"
                            description: "Describe or retrieve the full configuration of any Kubernetes resource for troubleshooting. Read-only - cannot create, modify, or delete resources."
                            tags:
                              - kubernetes
                              - inspection
                          - id: event-and-log-review
                            name: "Event and Log Review"
                            description: "Review recent Kubernetes events and pod logs to help diagnose issues."
                            tags:
                              - kubernetes
                              - logs
                              - events
                      modelConfig: litellm-model
                      runtime: python
                      systemMessage: |
                        You're a helpful agent, made by the kagent team.

                        # Instructions
                            - If user question is unclear, ask for clarification before running any tools
                            - Always be helpful and friendly
                            - If you don't know how to answer the question DO NOT make things up, tell the user "Sorry, I don't know how to answer that" and ask them to clarify the question further
                            - If you are unable to help, or something goes wrong, refer the user to https://kagent.dev for more information or support.

                        # Health assessment
                            - Pod/deployment status alone is not enough - a pod can show "Running" while still
                              flapping (CrashLoopBackOff between checks, repeated restarts) or its owning controller
                              can be stuck (scheduling failures, image pull errors, failed probes, OOM kills, volume
                              mount issues). Always also check recent Warning-type events (k8s_get_events) for the
                              relevant namespace/resource when assessing health - events often surface the real
                              problem before, or instead of, a visible status change.
                            - When asked for a general cluster/namespace health check (not about one specific,
                              already-identified resource), always include an events pass, not just a pod/deployment
                              listing.

                        # Tool usage - keep outputs small
                            - The model backing you has a limited context window. Oversized tool results will make the
                              whole request fail outright (not just get truncated) - so scope every call as narrowly as
                              possible up front, rather than fetching broadly and filtering after the fact.
                            - k8s_get_pod_logs: always pass a small tail_lines (50-200) unless the user explicitly asks
                              for more history. Never fetch full/unbounded logs from a pod you haven't already narrowed
                              down to.
                            - k8s_get_resources: for a SINGLE, already-identified resource, output=wide or output=json is
                              fine. For a BROAD/multi-resource listing, always use output=wide (a compact table), never
                              output=json or output=yaml - json/yaml embed each object's full body (spec+status+metadata),
                              which for resource types with large embedded status (Backup, Application, and similar CRDs)
                              can make a single all_namespaces=true call return more tokens than the entire context
                              window by itself, failing the whole request outright with no chance for compaction to help
                              (this happened for real: an all_namespaces=true, output=json listing of Backup resources
                              returned ~230K tokens in one response). Never combine all_namespaces=true with
                              output=json/yaml. If you need to check the same resource_type across several specific
                              namespaces (e.g. backup status app-by-app), query each namespace individually with
                              output=wide rather than one unscoped all_namespaces call.
                            - k8s_get_resource_yaml / k8s_describe_resource: fine for a single, already-identified
                              resource - avoid looping these across many resources in one investigation without a good
                              reason.
                            - k8s_get_events: scope to a namespace (or a specific resource) rather than fetching
                              cluster-wide events unscoped; sort/skim for Warning-type entries first.
                            - If you genuinely need a broad view first, get a compact listing (wide/json, narrow
                              namespace) to identify the specific resource(s) involved, then drill into just those with
                              more detailed calls - don't fetch full detail for everything at once.

                        # Response format:
                            - ALWAYS format your response as Markdown
                            - Your response will include a summary of actions you took and an explanation of the result
                            - If you created any artifacts such as files or resources, you will include those in your response as well
                      tools:
                      - mcpServer:
                          apiGroup: kagent.dev
                          kind: RemoteMCPServer
                          name: kagent-tool-server
                          namespace: kagent
                          # Read-only/inspection tools only - this agent is a
                          # health-checker (planned for A2A registration with
                          # Hermes), not an operator. Mutating tools
                          # (create/delete/patch/label/annotate/scale/rollout/
                          # apply/exec) removed 2026-08-14: not needed yet, and
                          # removing them now is safer than granting write
                          # access before there's an actual need for it.
                          toolNames:
                          - k8s_check_service_connectivity
                          - k8s_describe_resource
                          - k8s_generate_resource
                          - k8s_get_available_api_resources
                          - k8s_get_cluster_configuration
                          - k8s_get_events
                          - k8s_get_pod_logs
                          - k8s_get_resource_yaml
                          - k8s_get_resources
                        type: McpServer
                    description: Test LiteLLM
                    type: Declarative
              # Exposes k8s-agent-litellm's A2A endpoint for registration in
              # LiteLLM's A2A gateway. Points at kagent-controller:8083 (the
              # A2A server), NOT kagent-ui:8080 (the existing kagent-httproute
              # above, which serves the web UI). Path is scoped to exactly
              # this agent's A2A path, deliberately excluding
              # /api/a2a/kagent/k8s-agent - the OpenAI-backed backup agent is
              # not meant to be reachable here, matching explicit direction
              # not to register it in A2A. No auth for now, per direction.
              k8s-agent-litellm-a2a:
                apiVersion: gateway.networking.k8s.io/v1beta1
                kind: HTTPRoute
                forceRename: "k8s-agent-litellm-a2a"
                annotations:
                  k8s-dashboard-group: AI tools
                  k8s-dashboard-appname: KAgent LiteLLM Agent (A2A)
                spec:
                  spec:
                    parentRefs:
                      - name: cilium-gw
                        namespace: cilium-system
                        group: gateway.networking.k8s.io
                        kind: Gateway
                    hostnames:
                      - kagent-a2a-{{name}}.{{ domainname }}
                    rules:
                      - backendRefs:
                          - group: ''
                            kind: Service
                            name: kagent-controller
                            namespace: kagent
                            port: 8083
                            weight: 1
                        matches:
                          - path:
                              type: PathPrefix
                              value: /api/a2a/kagent/k8s-agent-litellm
              # Custom Agent (not the bundled observability-agent - see the
              # note on grafana-mcp.enabled above for why). PromQL analysis
              # backed by grafana-mcp's query_prometheus/list_prometheus_*
              # tools, trimmed to exclude update_dashboard (a write
              # capability - breaks the read-only pattern every other agent
              # here follows) and the Loki/OnCall tools (unused, no Loki
              # deployed in this homelab).
              kagent-observability:
                apiVersion: kagent.dev/v1alpha2
                kind: Agent
                forceRename: "kagent-observability"
                spec:
                  spec:
                    declarative:
                      context:
                        compaction:
                          compactionInterval: 5
                          overlapSize: 2
                          tokenThreshold: 31000
                      a2aConfig:
                        skills:
                          - id: analyze-prometheus-metrics
                            name: Analyze Prometheus Metrics
                            description: Query and analyze Prometheus metrics - execute PromQL, discover available metrics/labels, and ground analysis in existing Grafana dashboards.
                            tags:
                              - prometheus
                              - promql
                              - metrics
                              - monitoring
                              - grafana
                            examples:
                              - "What's the GPU utilization on k8s02 right now?"
                              - "Show me the error rate for the litellm deployment over the last hour."
                            inputModes: ["text"]
                            outputModes: ["text"]
                      modelConfig: litellm-model
                      systemMessage: |
                        You are a read-only Prometheus metrics analyst. You
                        query real metric data via PromQL (through Grafana's
                        Prometheus datasource) and can search existing
                        Grafana dashboards for context - you cannot modify
                        anything (no dashboard edits, no Prometheus config
                        changes).

                        This is a multi-cluster Prometheus: several
                        clusters' metrics are federated into one instance,
                        each series carrying a `cluster` label identifying
                        which cluster it came from. When a question is
                        about a specific cluster, always filter/aggregate
                        by the `cluster` label rather than assuming which
                        clusters exist - if you're not sure what values it
                        takes, query `list_prometheus_label_values` for
                        `cluster` first rather than guessing a name.

                        Workflow: every Prometheus/dashboard tool here
                        takes a datasourceUid argument - never guess one
                        (e.g. "prometheus"). If you don't already know it
                        for this session, call list_datasources first and
                        use the real UID it returns.

                        When you don't already know the exact
                        metric name, use list_prometheus_metric_names /
                        list_prometheus_metric_metadata to find it and
                        understand its type (counter/gauge/histogram)
                        before writing a query - a counter needs rate()/
                        increase(), a gauge doesn't. Use
                        list_prometheus_label_names / list_prometheus_label_values
                        to discover what a metric can be filtered/grouped
                        by. Use search_dashboards when it's useful to
                        ground your analysis in an existing, human-curated
                        view (e.g. "what does the GPU dashboard show")
                        rather than always building a query from scratch.

                        Tool usage - keep outputs small: choose a
                        reasonable time range and step for range queries
                        instead of over-fetching; prefer an aggregated
                        query (sum/avg/max by a label) over returning every
                        individual time series when the user asked a
                        summary-level question.

                        Always show the actual PromQL query you ran
                        alongside the result, so the user can verify or
                        reuse it.
                      tools:
                        - type: McpServer
                          mcpServer:
                            apiGroup: kagent.dev
                            kind: RemoteMCPServer
                            name: kagent-grafana-mcp
                            namespace: kagent
                            toolNames:
                              # list_datasources added after a live test:
                              # every other tool here takes a datasourceUid
                              # argument, and without a way to discover the
                              # real one the agent just guessed "prometheus"
                              # (wrong) instead of asking Grafana - this is
                              # a required prerequisite, not optional
                              # discovery.
                              - list_datasources
                              - query_prometheus
                              - list_prometheus_metric_names
                              - list_prometheus_metric_metadata
                              - list_prometheus_label_names
                              - list_prometheus_label_values
                              - search_dashboards
                    description: "Read-only Prometheus metrics analysis - PromQL queries, metric/label discovery, and dashboard-grounded context, across all clusters this Prometheus instance monitors"
                    type: Declarative
              kagent-observability-a2a:
                apiVersion: gateway.networking.k8s.io/v1beta1
                kind: HTTPRoute
                forceRename: "kagent-observability-a2a"
                annotations:
                  k8s-dashboard-group: AI tools
                  k8s-dashboard-appname: KAgent Observability Agent (A2A)
                spec:
                  spec:
                    parentRefs:
                      - name: cilium-gw
                        namespace: cilium-system
                        group: gateway.networking.k8s.io
                        kind: Gateway
                    hostnames:
                      - kagent-a2a-{{name}}.{{ domainname }}
                    rules:
                      - backendRefs:
                          - group: ''
                            kind: Service
                            name: kagent-controller
                            namespace: kagent
                            port: 8083
                            weight: 1
                        matches:
                          - path:
                              type: PathPrefix
                              value: /api/a2a/kagent/kagent-observability
        repoURL: https://bjw-s-labs.github.io/helm-charts
        chart: app-template
        targetRevision: 4.4.0        
      destination:
        server: '{{server}}' 
        namespace: kagent
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true 
      