apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kagent
  namespace: argocd
  annotations:
    appset-dashboard-appname: "KAgent - AI for K8S"
    appset-dashboard-groupname: "AI tools"
  labels:
    appset-dashboard-multicluster: "true"    
spec:
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  kagent: "installed"
          - plugin:
              configMapRef:
                name: argocd-secrets-plugin
              input:
                parameters:
                  secretName: "k8s-clusters-apps-secrets"  
  template:
    metadata:
      name: '{{name}}-kagent'
    spec:
      project: k8s-homelab-apps
      sources:
      - helm:
          releaseName: kagent-crd
          parameters:
            - name: crds.enabled
              value: "true"          
        repoURL: oci://ghcr.io/kagent-dev/kagent/helm/kagent-crds
        targetRevision: 0.9.12
        path: .
      - helm:
          releaseName: kagent
          values: |
            providers:
              default: openAI
              openAI:
                model: gpt-5-mini
                apiKey: "{{openai-api-key}}"
            database:
              postgres:
                bundled:
                  enabled: true
                  storage: 5Gi
                  storageClassName: synas-csi-retain
        repoURL: oci://ghcr.io/kagent-dev/kagent/helm/kagent
        targetRevision: 0.9.12
        path: .
      - helm:
          releaseName: kagent-httproute
          values: |
            controllers: 
              main:
               enabled: false
            rawResources:
              kagent-httproute:
                apiVersion: gateway.networking.k8s.io/v1beta1
                kind: HTTPRoute
                annotations:
                  k8s-dashboard-group: AI tools
                  k8s-dashboard-appname: KAgent - AI for K8S                
                spec:
                  spec:
                    parentRefs:
                      - name: cilium-gw
                        namespace: cilium-system
                        group: gateway.networking.k8s.io
                        kind: Gateway                        
                    hostnames:
                      - kagent-{{name}}.{{ domainname }}
                    rules:  
                      - backendRefs:
                          - group: ''
                            kind: Service
                            name: kagent-ui
                            namespace: kagent
                            port: 8080
                            weight: 1
                        matches:
                          - path:
                              type: PathPrefix
                              value: /
        repoURL: https://bjw-s-labs.github.io/helm-charts
        chart: app-template
        targetRevision: 4.4.0        
      destination:
        server: '{{server}}' 
        namespace: kagent
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true 
      