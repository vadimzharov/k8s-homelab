apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: litellm
  namespace: argocd
  annotations:
    appset-dashboard-appname: "LiteLLM"
    appset-dashboard-groupname: "AI tools"
spec:
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  litellm: "installed"
          - plugin:
              configMapRef:
                name: argocd-secrets-plugin
              input:
                parameters:
                  secretName: "k8s-clusters-apps-secrets"
  template:
    metadata:
      name: '{{name}}-litellm'
    spec:
      project: k8s-homelab-apps
      sources:
      - helm:
          releaseName: litellm-db
          values: |
            controllers: 
              main:
               enabled: false
            rawResources:
              minio-credentials:
                apiVersion: v1
                kind: Secret
                forceRename: "minio-credentials"
                spec:
                  stringData:
                    accesskey: {{ miniokey }}
                    secretkey: {{ miniosecretkey }}
              backupobjectstore:
                apiVersion: barmancloud.cnpg.io/v1
                kind: ObjectStore
                forceRename: "litellm-db-backup"
                spec:
                  spec:
                    retentionPolicy: "5d"
                    configuration:
                      destinationPath: s3://cloudnative-pg-backups/litellm-db/
                      endpointURL: http://{{ minioendpoint }}
                      s3Credentials:
                        accessKeyId:
                          name:  minio-credentials
                          key: accesskey
                        secretAccessKey:
                          name: minio-credentials
                          key: secretkey
                      wal:
                        compression: gzip
              scheduledbackup:
                apiVersion: postgresql.cnpg.io/v1
                kind: ScheduledBackup
                forceRename: litellm-db-backup
                spec:
                  spec:
                    schedule: "0 0/30 * * * *" 
                    backupOwnerReference: self
                    cluster:
                      name: litellm-db
                    method: plugin
                    pluginConfiguration:
                      name: barman-cloud.cloudnative-pg.io                        
              pgsqlcluster:
                apiVersion: postgresql.cnpg.io/v1
                kind: Cluster
                forceRename: "litellm-db"
                annotations:
                  cnpg.io/skipEmptyWalArchiveCheck: "enabled"
                spec:
                  spec:
                    instances: 1

                    storage:
                      size: 10Gi
                      storageClass: synas-csi-delete
                                        
                    bootstrap:
                      recovery:
                        source: origin
                        database: litellm
                        owner: litellm

                    externalClusters:
                      - name: origin
                        plugin:
                          name: barman-cloud.cloudnative-pg.io
                          parameters:
                            barmanObjectName: litellm-db-backup
                            serverName: litellm-db

                    imageName: ghcr.io/cloudnative-pg/postgresql:16.9-standard-bookworm

                    plugins:
                    - name: barman-cloud.cloudnative-pg.io
                      isWALArchiver: true
                      parameters:
                        barmanObjectName: litellm-db-backup
        repoURL: https://bjw-s-labs.github.io/helm-charts
        chart: app-template
        targetRevision: 4.4.0
      - helm:
          releaseName: litellm
          values: |
            replicaCount: 1

            service:
              type: ClusterIP
              port: 4000

            # No Ingress - using Gateway API HTTPRoute instead (see extraResources below).
            ingress:
              enabled: false
            
            masterkey: "{{litellm-master-key}}"
            masterkeySecretName: ""
            masterkeySecretKey: ""

            # Provider API keys are NOT stored here. Create this Secret out-of-band
            # before installing:
            #   kubectl create secret generic litellm-provider-keys -n litellm \
            #     --from-literal=OPENAI_API_KEY=sk-... \
            #     --from-literal=ANTHROPIC_API_KEY=sk-ant-...
            # Its keys are exposed to the proxy pod as env vars and referenced from
            # proxy_config below via `os.environ/<KEY>`.
            environmentSecrets:
              - litellm-provider-keys

            proxy_config:
              model_list:
                # --- Cloud backends ---
                - model_name: gpt-4o-mini
                  litellm_params:
                    model: openai/gpt-4o-mini
                    api_key: os.environ/OPENAI_API_KEY

                - model_name: gpt-5.4-nano
                  litellm_params:
                    model: openai/gpt-5.4-nano
                    api_key: os.environ/OPENAI_API_KEY

                - model_name: gpt-5.6-luna
                  litellm_params:
                    model: openai/gpt-5.6-luna
                    api_key: os.environ/OPENAI_API_KEY                    

                #- model_name: claude-sonnet
                #  litellm_params:
                #    model: anthropic/claude-sonnet-4-5
                #    api_key: os.environ/ANTHROPIC_API_KEY

                # --- Self-hosted backend ---
                - model_name: qwen2.5-7b-instruct
                  litellm_params:
                    model: hosted_vllm/Qwen/Qwen2.5-7B-Instruct
                    api_base: http://vllm-qwen-engine-service.vllm.svc.cluster.local:8000/v1
                    api_key: "{{ vllm-master-key }}"
                  model_info:
                    input_cost_per_token: 0
                    output_cost_per_token: 0
                  model_info:
                    input_cost_per_token: 0
                    output_cost_per_token: 0

                - model_name: gpt-oss-20b
                  litellm_params:
                    model: hosted_vllm/openai/gpt-oss-20b
                    api_base: http://vllm-gptoss-engine-service.vllm.svc.cluster.local:8000/v1
                    api_key: "{{ vllm-master-key }}"   # must match apps/vllm/secrets.local.yaml
                  model_info:
                    input_cost_per_token: 0
                    output_cost_per_token: 0                    

              general_settings:
                master_key: os.environ/PROXY_MASTER_KEY

              # Forces greedy/deterministic decoding (temperature=0, seed=0),
              # but ONLY for gpt-oss-20b requests that carry a `tools` list
              # (see custom_temp_override.py, shipped via extraResources /
              # volumes / volumeMounts below). gpt-oss's Harmony tool-call
              # format is a strict token grammar; at default sampling the
              # model occasionally emits a malformed tool-call recipient
              # (e.g. "k8s_get_resources<|channel|>commentary" instead of
              # "k8s_get_resources") once conversation context grows across
              # a multi-turn agentic session. Greedy decoding removes the
              # sampling step that lets it wander off that grammar. Scoped to
              # gpt-oss-20b + tool-bearing requests only, so it doesn't
              # change behavior for the other models on this proxy or for
              # plain chat traffic.
              litellm_settings:
                callbacks: ["custom_temp_override.proxy_handler_instance"]

            # resources:
            #   requests:
            #     cpu: 250m
            #     memory: 256Mi
            #   limits:
            #     cpu: "1"
            #     memory: 512Mi

            # Single replica for now: cross-pod rate limiting / spend coordination isn't
            # needed yet. Set redis.enabled: true if replicaCount is ever raised above 1.
            redis:
              enabled: false

            db:
              deployStandalone: false
              useExisting: true
              database: litellm
              secret:
                name: litellm-db-app
                usernameKey: username
                passwordKey: password
                endpointKey: host              

            # Bundled Bitnami postgresql subchart, used because db.deployStandalone: true.
            # SECURITY: the chart reads postgresql.auth.password/postgres-password
            # directly from values to build its own DB credentials Secret, so a real
            # password placed here WILL end up both in this file and in a rendered
            # Kubernetes Secret. Do not commit real values — override at install time:
            #   helm install litellm ./litellm-helm -n litellm --create-namespace \
            #     -f values.yaml \
            #     --set postgresql.auth.password=<generated> \
            #     --set postgresql.auth.postgres-password=<generated>
            # postgresql:
            #   image:
            #     registry: docker.io
            #     repository: bitnamilegacy/postgresql
            #     tag: 16.2.0-debian-12-r6            
            #   auth:
            #     username: litellm
            #     database: litellm
            #     password: "NoTaGrEaTpAsSwOrD"
            #     postgres-password: "NoTaGrEaTpAsSwOrD"
            #   primary:
            #     persistence:
            #       enabled: true
            #       storageClass: "synas-csi-delete"
            #       size: 8Gi

            # Mounts custom_temp_override.py (the ConfigMap added below under
            # extraResources) into the SAME directory as config.yaml
            # (/etc/litellm/), because LiteLLM resolves a "module.instance"
            # callback string by loading "module.py" from
            # os.path.dirname(<path to config.yaml>) - it does not look on
            # PYTHONPATH or anywhere else. The built-in config.yaml volume
            # mount only ever projects that one key, so this file has to
            # arrive via its own volume + volumeMount rather than as a
            # second key on the chart's own generated ConfigMap.
            volumes:
              - name: litellm-custom-callbacks
                configMap:
                  name: litellm-custom-callbacks

            volumeMounts:
              - name: litellm-custom-callbacks
                mountPath: /etc/litellm/custom_temp_override.py
                subPath: custom_temp_override.py
                readOnly: true

            # No PodDisruptionBudget: single replica, a PDB wouldn't protect anything.
            pdb:
              enabled: false

            # Gateway API HTTPRoute, shipped as part of this release instead of Ingress.
            # FILL IN before installing:
            #   - parentRefs[0].name / namespace: your existing Gateway resource
            #   - hostnames[0]: the hostname you want to route to LiteLLM
            extraResources:
              - apiVersion: v1
                kind: Secret
                metadata:
                  name: litellm-provider-keys
                  namespace: litellm
                type: Opaque
                stringData:
                  OPENAI_API_KEY: "{{litellm-openai-api-key}}"
            #      ANTHROPIC_API_KEY: "{{litellm-anthropic-api-key}}"                    
              - apiVersion: gateway.networking.k8s.io/v1
                kind: HTTPRoute
                metadata:
                  name: litellm
                  namespace: litellm
                spec:
                  parentRefs:
                    - name: "cilium-gw"
                      namespace: "cilium-system"
                  hostnames:
                    - "litellm.{{ domainname }}"
                  rules:
                    - backendRefs:
                        - name: litellm
                          port: 4000

              # Custom pre-call hook, wired up via litellm_settings.callbacks
              # above and mounted into /etc/litellm/ via volumes/volumeMounts
              # above. Forces temperature=0/seed=0 only for gpt-oss-20b
              # requests carrying a `tools` list - see the comment on
              # litellm_settings.callbacks above for the full "why".
              - apiVersion: v1
                kind: ConfigMap
                metadata:
                  name: litellm-custom-callbacks
                  namespace: litellm
                data:
                  custom_temp_override.py: |
                    from litellm.integrations.custom_logger import CustomLogger


                    class ToolCallDeterminism(CustomLogger):
                        """Forces greedy decoding for gpt-oss-20b tool-calling requests.

                        gpt-oss's Harmony tool-call format is a strict token grammar
                        (channel/recipient/message markers). Under default sampling the
                        model occasionally emits a malformed recipient - e.g.
                        "k8s_get_resources<|channel|>commentary" instead of a clean
                        "k8s_get_resources" - once conversation context grows across a
                        multi-turn agentic session. Greedy decoding (temperature=0)
                        removes the sampling step that lets it wander off that grammar.

                        Scoped to gpt-oss-20b + requests that actually carry a `tools`
                        list, so plain chat calls and every other model on this proxy
                        (gpt-4o-mini, gpt-5.4-nano, gpt-5.6-luna, qwen2.5-7b-instruct)
                        are unaffected.
                        """

                        TARGET_MODELS = {"gpt-oss-20b"}

                        async def async_pre_call_hook(
                            self, user_api_key_dict, cache, data, call_type
                        ):
                            if data.get("model") in self.TARGET_MODELS and data.get("tools"):
                                data["temperature"] = 0
                                data["seed"] = 0
                            return data


                    proxy_handler_instance = ToolCallDeterminism()
        repoURL: oci://ghcr.io/berriai/litellm-helm
        targetRevision: 1.93.0
        path: .    
      destination:
        server: '{{server}}' 
        namespace: litellm
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
      