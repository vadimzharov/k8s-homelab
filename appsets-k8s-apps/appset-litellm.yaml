apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: litellm
  namespace: argocd
  annotations:
    appset-dashboard-appname: "LiteLLM"
    appset-dashboard-groupname: "AI tools"
spec:
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  litellm: "installed"
          - plugin:
              configMapRef:
                name: argocd-secrets-plugin
              input:
                parameters:
                  secretName: "k8s-clusters-apps-secrets"
  template:
    metadata:
      name: '{{name}}-litellm'
    spec:
      project: k8s-homelab-apps
      sources:
      - helm:
          releaseName: litellm-db
          values: |
            controllers: 
              main:
               enabled: false
            rawResources:
              minio-credentials:
                apiVersion: v1
                kind: Secret
                forceRename: "minio-credentials"
                spec:
                  stringData:
                    accesskey: {{ miniokey }}
                    secretkey: {{ miniosecretkey }}
              backupobjectstore:
                apiVersion: barmancloud.cnpg.io/v1
                kind: ObjectStore
                forceRename: "litellm-db-backup"
                spec:
                  spec:
                    retentionPolicy: "5d"
                    configuration:
                      destinationPath: s3://cloudnative-pg-backups/litellm-db
                      endpointURL: http://{{ minioendpoint }}
                      s3Credentials:
                        accessKeyId:
                          name:  minio-credentials
                          key: accesskey
                        secretAccessKey:
                          name: minio-credentials
                          key: secretkey
                      wal:
                        compression: gzip
              scheduledbackup:
                apiVersion: postgresql.cnpg.io/v1
                kind: ScheduledBackup
                forceRename: litellm-db-backup
                spec:
                  spec:
                    schedule: "0 0/30 * * * *" 
                    backupOwnerReference: self
                    cluster:
                      name: litellm-db
                    method: plugin
                    pluginConfiguration:
                      name: barman-cloud.cloudnative-pg.io                        
              pgsqlcluster:
                apiVersion: postgresql.cnpg.io/v1
                kind: Cluster
                forceRename: "litellm-db"
                annotations:
                  cnpg.io/skipEmptyWalArchiveCheck: "enabled"
                spec:
                  spec:
                    instances: 1

                    storage:
                      size: 10Gi
                      storageClass: synas-csi-delete
                                        
                    bootstrap:
                      recovery:
                        source: origin
                        database: litellm
                        owner: litellm

                    externalClusters:
                      - name: origin
                        plugin:
                          name: barman-cloud.cloudnative-pg.io
                          parameters:
                            barmanObjectName: litellm-db-backup
                            serverName: litellm-db

                    imageName: ghcr.io/cloudnative-pg/postgresql:16.9-standard-bookworm

                    plugins:
                    - name: barman-cloud.cloudnative-pg.io
                      isWALArchiver: true
                      parameters:
                        barmanObjectName: litellm-db-backup
        repoURL: https://bjw-s-labs.github.io/helm-charts
        chart: app-template
        targetRevision: 4.4.0
      - helm:
          releaseName: litellm
          values: |
            replicaCount: 1

            service:
              type: ClusterIP
              port: 4000

            # No Ingress - using Gateway API HTTPRoute instead (see extraResources below).
            ingress:
              enabled: false
            
            masterkey: "{{litellm-master-key}}"
            masterkeySecretName: ""
            masterkeySecretKey: ""

            # Provider API keys are NOT stored here. Create this Secret out-of-band
            # before installing:
            #   kubectl create secret generic litellm-provider-keys -n litellm \
            #     --from-literal=OPENAI_API_KEY=sk-... \
            #     --from-literal=ANTHROPIC_API_KEY=sk-ant-...
            # Its keys are exposed to the proxy pod as env vars and referenced from
            # proxy_config below via `os.environ/<KEY>`.
            environmentSecrets:
              - litellm-provider-keys

            proxy_config:
              model_list:
                # --- Cloud backends ---
                - model_name: gpt-4o-mini
                  litellm_params:
                    model: openai/gpt-4o-mini
                    api_key: os.environ/OPENAI_API_KEY

                - model_name: gpt-5.4-nano
                  litellm_params:
                    model: openai/gpt-5.4-nano
                    api_key: os.environ/OPENAI_API_KEY

                - model_name: gpt-5.6-luna
                  litellm_params:
                    model: openai/gpt-5.6-luna
                    api_key: os.environ/OPENAI_API_KEY                    

                #- model_name: claude-sonnet
                #  litellm_params:
                #    model: anthropic/claude-sonnet-4-5
                #    api_key: os.environ/ANTHROPIC_API_KEY

                # --- Self-hosted backend ---
                # vLLM decommissioned 2026-08-03: the single RTX 3090 now runs
                # ik_llama.cpp serving Qwen3.6-27B instead (see
                # appset-ik-llama-qwen3-6-27b.yaml). The vllm-* Services these two entries
                # point at don't currently exist (cluster label flipped from
                # vllm:vllm-gpt-oss-20b to ik-llama:installed, appset-vllm-*.yaml no longer
                # match any cluster) - calls to either will fail until vLLM is redeployed.
                # Left active (not commented out) deliberately: access is controlled via
                # virtual keys instead, and this way switching back to vLLM later doesn't
                # need a LiteLLM redeploy, just the cluster label flip + these keys re-enabled.
                - model_name: qwen2.5-7b-instruct
                  litellm_params:
                    model: hosted_vllm/Qwen/Qwen2.5-7B-Instruct
                    api_base: http://vllm-qwen-engine-service.vllm.svc.cluster.local:8000/v1
                    api_key: "{{ vllm-master-key }}"
                  model_info:
                    input_cost_per_token: 0
                    output_cost_per_token: 0

                - model_name: gpt-oss-20b
                  litellm_params:
                    model: hosted_vllm/openai/gpt-oss-20b
                    api_base: http://vllm-gptoss-engine-service.vllm.svc.cluster.local:8000/v1
                    api_key: "{{ vllm-master-key }}"   # must match apps/vllm/secrets.local.yaml
                  model_info:
                    input_cost_per_token: 0
                    output_cost_per_token: 0

                # NOTE: kagent's Agent CR (k8s-agent-litellm, not GitOps-managed - see
                # docs/05-kagent-config.md) still directly references "gpt-oss-20b" as its
                # ModelConfig. That model_name resolves in LiteLLM's model_list but the
                # underlying vLLM Service doesn't exist right now, so kagent is currently
                # broken until either vLLM comes back or its ModelConfig is repointed at
                # qwen3.6-27b separately.

                # ik_llama.cpp serving Qwen3.6-27B (see appset-ik-llama-qwen3-6-27b.yaml
                # in this repo). In-cluster Service endpoint, no HTTPRoute - both LiteLLM
                # and ik_llama.cpp run on the same cluster, so no need to round-trip through
                # the external Gateway. No api_key: the ik_llama.cpp server has no auth
                # configured (confirmed no Authorization enforcement), and its OpenAI-compat
                # endpoint doesn't validate the "model" field against anything (confirmed by
                # calling it directly with an arbitrary model string) - "not-needed" is a
                # placeholder purely because the OpenAI SDK requires a non-empty api_key value.
                #
                # max_parallel_requests: 1 matches the server's real -np 1 capacity
                # (single request slot, deliberately not raised - see
                # appset-ik-llama-qwen3-6-27b.yaml for why). Confirmed from LiteLLM's own
                # source this is enforced via an asyncio.Semaphore per deployment - extra
                # concurrent requests queue and wait here rather than being rejected, and
                # rather than all piling up unbounded against the backend's own queue.
                # Model-specific: read from this deployment's own litellm_params, doesn't
                # affect any other model_list entry.
                - model_name: qwen3.6-27b
                  litellm_params:
                    model: openai/qwen3.6-27b
                    api_base: http://ik-llama-qwen3-6-27b.ik-llama.svc.cluster.local:8080/v1
                    api_key: "not-needed"
                    max_parallel_requests: 1
                  model_info:
                    input_cost_per_token: 0
                    output_cost_per_token: 0

                # --- Ollama (CPU-only, no GPU contention with vLLM) ---
                # No api_key: Ollama has no auth enabled (OLLAMA_AUTH unset, defaults to
                # false - see docs/09-ollama.md in k8s-ai-homelab) and LiteLLM's Ollama
                # provider only sends an Authorization header if api_key is set.
                - model_name: llama3.2-1b
                  litellm_params:
                    model: ollama/llama3.2:1b
                    api_base: http://ollama.ollama.svc.cluster.local:11434
                  model_info:
                    input_cost_per_token: 0
                    output_cost_per_token: 0

                - model_name: qwen2.5-1.5b
                  litellm_params:
                    model: ollama/qwen2.5:1.5b
                    api_base: http://ollama.ollama.svc.cluster.local:11434
                  model_info:
                    input_cost_per_token: 0
                    output_cost_per_token: 0

                # --- Auto Router: complexity_router with an LLM classifier (qwen2.5-1.5b
                # above) instead of the default zero-API-call heuristic scorer.
                # Was llama3.2-1b - confirmed misclassifying a plain factual question
                # ("Tell me about Roman Empire") as COMPLEX with full confidence
                # (score=1.000), not a timeout/fallback. Switched to try qwen2.5-1.5b
                # instead; also unrelated to the GPU (both Ollama models are always
                # available regardless of which vLLM model is currently deployed).
                # SIMPLE/MEDIUM deliberately route to self-hosted models, not cloud:
                #   - SIMPLE -> llama3.2-1b (Ollama, CPU-only, always available - no
                #     GPU contention, appropriately small for simple requests).
                #   - MEDIUM -> qwen3.6-27b (ik_llama.cpp/GPU, updated 2026-08-03 -
                #     was gpt-oss-20b, now decommissioned along with the rest of vLLM in
                #     favor of ik_llama.cpp on the single RTX 3090 - see
                #     appset-ik-llama-qwen3-6-27b.yaml). Same single-GPU-availability
                #     caveat as before still applies in spirit: this is the only
                #     self-hosted GPU model now, so MEDIUM/REASONING calls depend on this
                #     one Deployment staying up rather than picking between two.
                # COMPLEX stays on cloud (gpt-4o-mini), but NOT gpt-5.6-luna: real
                # production failure confirmed (2026-08-01) - OpenAI's API defaults
                # gpt-5.6-luna into a reasoning mode that's incompatible with function
                # tools over /v1/chat/completions ("Function tools with reasoning_effort
                # are not supported... use /v1/responses or set reasoning_effort to
                # 'none'"), and Open WebUI attaches its full toolset (34 tools) to
                # essentially every request. This isn't a misclassification problem - a
                # *correctly* classified COMPLEX/REASONING request would fail
                # identically, so no classifier accuracy improvement fixes it.
                # gpt-4o-mini works because it's not part of the reasoning-effort model
                # family at all, so it can't hit this failure mode. gpt-5.4-nano was
                # considered but not used - untested, and plausibly shares
                # gpt-5.6-luna's reasoning-family behavior going by the naming pattern,
                # not worth the risk of hitting the same bug again.
                # REASONING -> qwen3.6-27b instead of gpt-4o-mini: gpt-4o-mini isn't a
                # reasoning model at all, which defeats the point of a dedicated
                # REASONING tier. qwen3.6-27b is a genuine hybrid-reasoning model
                # (thinking mode, tool-calling via --jinja/--parallel-tool-calls on the
                # ik_llama.cpp side) without gpt-5.6-luna's chat-completions restriction.
                # Not yet proven with real agentic tool-calling traffic the way
                # gpt-oss-20b was for kagent - kagent itself is currently broken (its
                # ModelConfig still points at the now-gone gpt-oss-20b) and needs a
                # separate fix to point at qwen3.6-27b before that claim can be verified
                # here the same way.
                # Any classifier failure (timeout, bad JSON, provider error) falls back
                # silently to the heuristic scorer (confirmed from LiteLLM's own
                # complexity_router.py), so this is low-risk to leave live while tuning.
                - model_name: smart-router
                  litellm_params:
                    model: auto_router/complexity_router
                    complexity_router_default_model: gpt-4o-mini
                    complexity_router_config:
                      classifier_type: llm
                      classifier_llm_config:
                        model: qwen2.5-1.5b
                        # Raised from 3000: repeatedly hit on CPU inference, worse on a
                        # cold model load (Ollama pod, no GPU) - confirmed via
                        # LiteLLM pod logs showing multiple 3.0s timeouts before either
                        # eventual success or falling back to the heuristic scorer.
                        timeout_ms: 9000
                      tiers:
                        SIMPLE: llama3.2-1b
                        MEDIUM: qwen3.6-27b
                        COMPLEX: gpt-4o-mini
                        REASONING: qwen3.6-27b

              # MCP servers, config.yaml-managed (not store_model_in_db-backed - that's
              # only required for the UI/DB-managed path, per LiteLLM's own docs).
              # palette-mcp namespace/Service is the mcp-proxy sidecar bridging Spectro
              # Cloud's stdio-only palette-mcp binary to SSE (see apps-palette-mcp.yaml)
              # - LiteLLM only talks to that internal, unauthenticated SSE endpoint;
              # real Palette auth happens inside the sidecar via PALETTE_API_KEY.
              mcp_servers:
                palette:
                  transport: "sse"
                  url: "http://palette-mcp.palette-mcp.svc.cluster.local:8080/sse"
                  description: "Spectro Cloud Palette - cluster management, fleet health, infrastructure operations"

                # argoproj-labs/mcp-for-argocd (see appset-argocd-mcp.yaml), a native MCP
                # implementation (not a bridged/proxied stdio binary like palette above) -
                # it speaks the MCP protocol directly over streamable HTTP (POST /mcp,
                # session via the Mcp-Session-Id header), hence transport: "http" here
                # rather than "sse". In-cluster Service endpoint, no HTTPRoute - both
                # LiteLLM and this server run on the same cluster. No api_key: LiteLLM
                # only talks to this internal, unauthenticated endpoint; the real ArgoCD
                # API token is configured inside the server itself (ARGOCD_API_TOKEN env
                # var), one hop further down, same pattern as Palette's PALETTE_API_KEY.
                argocd:
                  transport: "http"
                  url: "http://argocd-mcp.argocd-mcp.svc.cluster.local:3000/mcp"
                  description: "ArgoCD - list/get/sync applications, inspect resources, view workload logs and events"

              # A2A agent gateway. k8s-agent-litellm is kagent's read-only,
              # LiteLLM-backed health-check agent (see appset-kagent.yaml) -
              # exposed via its own HTTPRoute (kagent-controller:8083, not
              # the kagent-ui route) scoped to just this agent's A2A path.
              # k8s-agent (the OpenAI-backed backup agent) is deliberately
              # NOT registered here, and its A2A path isn't even reachable
              # through that HTTPRoute.
              agents:
                - agent_name: k8s02-health-agent
                  agent_card_params:
                    name: "k8s-02 kagent"
                    url: "https://kagent-a2a-{{name}}.{{ domainname }}/api/a2a/kagent/k8s-agent-litellm/"
                    protocolVersion: "1.0"
                # k8s01 - {{name}} above resolves to k8s02 (where LiteLLM
                # itself is deployed), so it can't be reused here; this is a
                # different, remote cluster from LiteLLM's own vantage point,
                # hence the literal cluster name. {{ domainname }} is still
                # shared/global so it's reused as-is. Same appset, same
                # rawResources pattern, deployed independently on k8s01 -
                # see appset-kagent.yaml.
                - agent_name: k8s01-health-agent
                  agent_card_params:
                    name: "k8s-01 kagent"
                    url: "https://kagent-a2a-k8s01.{{ domainname }}/api/a2a/kagent/k8s-agent-litellm/"
                    protocolVersion: "1.0"
                # Hub/ArgoCD cluster (k3s, ARM, no persistent storage) - kagent
                # itself isn't installed there; this agent runs on k8s02 and
                # reaches the hub cluster's k8s API via a mounted kubeconfig
                # (see appset-k8s-hub-mcp.yaml / appset-k8s-hub-mcp-argocd-rbac.yaml),
                # plus the existing argocd-mcp server for ArgoCD app status.
                # See appset-kagent-hub-k8s-cluster.yaml.
                - agent_name: hub-cluster-agent
                  agent_card_params:
                    name: "Hub cluster (ArgoCD) kagent"
                    url: "https://kagent-a2a-hub.{{ domainname }}/api/a2a/kagent/kagent-hub-k8s-cluster/"
                    protocolVersion: "1.0"

              general_settings:
                master_key: os.environ/PROXY_MASTER_KEY
                # SSRF allowlist for the A2A agent card URLs above - both
                # resolve to an internal/private IP (the Cilium Gateway),
                # which LiteLLM's SSRF guard blocks by default for
                # user-supplied URLs (image_url, file_url, MCP/OpenAPI/A2A
                # spec fetches, etc). Entries are hostname-only (no scheme/
                # path) per LiteLLM's own field docs. Confirmed against the
                # pinned chart version's source (ConfigGeneralSettings in
                # litellm/proxy/_types.py) that this belongs under
                # general_settings, not litellm_settings.
                user_url_allowed_hosts:
                  - "kagent-a2a-k8s02.{{ domainname }}"
                  - "kagent-a2a-k8s01.{{ domainname }}"
                  - "kagent-a2a-hub.{{ domainname }}"
                # Lets the Admin UI's Logs page show full request/response
                # bodies per entry (previously "Request/Response Data Not
                # Available" - also why debugging past incidents had to
                # fall back to metadata.error_information and kagent's pod
                # logs instead). Deliberately NOT setting
                # store_model_in_db: true (the other setting LiteLLM's own
                # UI bundles into its suggested snippet) - that lets models
                # be added/edited via the Admin UI into the database
                # instead of this file, opening a way for the live model
                # list to drift from GitOps without anyone noticing.
                # Tradeoff worth knowing: kagent's K8s troubleshooting
                # tools can pull Secret YAML (base64, not encrypted) or
                # other sensitive cluster data into a prompt/response -
                # with this on, that ends up stored in the LiteLLM
                # Postgres DB.
                store_prompts_in_spend_logs: true
                # Allows models to be added/edited via the Admin UI,
                # persisting to the LiteLLM_Config DB table. DB values
                # deep-merge over config.yaml on every reload, so a
                # model created in the UI will coexist with (not replace)
                # YAML-defined models. Be aware the live model list can
                # drift from GitOps if models are managed through the UI.
                store_model_in_db: true

              # Sanitizes leaked Harmony control tokens (<|channel|>,
              # <|constrain|>, etc.) out of tool_call function names in
              # gpt-oss responses before they reach clients (kagent's ADK
              # dispatcher fails outright on a corrupted name, no way to
              # recover downstream). Known, currently-unfixed upstream bug:
              # vLLM issue #32587 / PR #35906, root-caused to the
              # openai/harmony library itself. See
              # docs/07-gpt-oss-tool-name-sanitizer.md in k8s-ai-homelab for
              # the full writeup. Callback code is the ConfigMap under
              # extraResources below, mounted alongside config.yaml (see
              # volumes/volumeMounts below for why that path specifically).
              litellm_settings:
                callbacks: custom_callbacks.proxy_handler_instance

            # resources:
            #   requests:
            #     cpu: 250m
            #     memory: 256Mi
            #   limits:
            #     cpu: "1"
            #     memory: 512Mi

            # Single replica for now: cross-pod rate limiting / spend coordination isn't
            # needed yet. Set redis.enabled: true if replicaCount is ever raised above 1.
            redis:
              enabled: false

            db:
              deployStandalone: false
              useExisting: true
              database: litellm
              secret:
                name: litellm-db-app
                usernameKey: username
                passwordKey: password
                endpointKey: host              

            # Bundled Bitnami postgresql subchart, used because db.deployStandalone: true.
            # SECURITY: the chart reads postgresql.auth.password/postgres-password
            # directly from values to build its own DB credentials Secret, so a real
            # password placed here WILL end up both in this file and in a rendered
            # Kubernetes Secret. Do not commit real values — override at install time:
            #   helm install litellm ./litellm-helm -n litellm --create-namespace \
            #     -f values.yaml \
            #     --set postgresql.auth.password=<generated> \
            #     --set postgresql.auth.postgres-password=<generated>
            # postgresql:
            #   image:
            #     registry: docker.io
            #     repository: bitnamilegacy/postgresql
            #     tag: 16.2.0-debian-12-r6            
            #   auth:
            #     username: litellm
            #     database: litellm
            #     password: "NoTaGrEaTpAsSwOrD"
            #     postgres-password: "NoTaGrEaTpAsSwOrD"
            #   primary:
            #     persistence:
            #       enabled: true
            #       storageClass: "synas-csi-delete"
            #       size: 8Gi

            # No PodDisruptionBudget: single replica, a PDB wouldn't protect anything.
            pdb:
              enabled: false

            # Mounts the custom_callbacks.py ConfigMap (see extraResources
            # below) alongside config.yaml at /etc/litellm/. Confirmed from
            # litellm's own source (litellm/proxy/types_utils/utils.py,
            # get_instance_fn): when resolving a dotted callback path like
            # "custom_callbacks.proxy_handler_instance", it first looks for
            # "custom_callbacks.py" in the *same directory as config.yaml*
            # before falling back to a normal Python import - the chart
            # mounts config.yaml at /etc/litellm/config.yaml, so that's
            # /etc/litellm/custom_callbacks.py. subPath keeps this from
            # clobbering the rest of that directory.
            volumes:
              - name: custom-callbacks
                configMap:
                  name: litellm-custom-callbacks
            volumeMounts:
              - name: custom-callbacks
                mountPath: /etc/litellm/custom_callbacks.py
                subPath: custom_callbacks.py

            # Gateway API HTTPRoute, shipped as part of this release instead of Ingress.
            # FILL IN before installing:
            #   - parentRefs[0].name / namespace: your existing Gateway resource
            #   - hostnames[0]: the hostname you want to route to LiteLLM
            extraResources:
              - apiVersion: v1
                kind: Secret
                metadata:
                  name: litellm-provider-keys
                  namespace: litellm
                type: Opaque
                stringData:
                  OPENAI_API_KEY: "{{litellm-openai-api-key}}"
            #      ANTHROPIC_API_KEY: "{{litellm-anthropic-api-key}}"
              - apiVersion: v1
                kind: ConfigMap
                metadata:
                  name: litellm-custom-callbacks
                  namespace: litellm
                  # NOT an ArgoCD hook (tried that, see docs/07's "Round 3"
                  # in k8s-ai-homelab - a PreSync-hook ConfigMap gets
                  # deleted on every sync via ArgoCD's default
                  # BeforeHookCreation policy, and being a "passive"
                  # resource with no completion state, ArgoCD does not
                  # reliably recreate it afterward - this actually deleted
                  # the ConfigMap from under a running pod on this cluster,
                  # 2026-07-27). Plain resource instead: on a cluster where
                  # this ConfigMap already exists, it just gets patched in
                  # place on every sync, no ordering issue. See docs/07 for
                  # the one-time manual bootstrap step this requires on a
                  # from-scratch install.
                data:
                  custom_callbacks.py: |
                    """Strip leaked Harmony control-token garbage out of tool_call
                    function names before responses reach clients. gpt-oss occasionally
                    emits these mid-generation; vLLM's "openai" tool-call parser passes
                    them through uncorrected (or, per the second corruption pattern
                    below, partially-but-wrongly corrected). See
                    docs/07-gpt-oss-tool-name-sanitizer.md in the k8s-ai-homelab repo
                    for the full incident writeup and upstream bug references
                    (vLLM issue #32587, PR #35906 - both unresolved as of writing).

                    Two corruption patterns observed in production (2026-07-27), same
                    underlying bug, different shapes - a naive "strip everything after
                    the first '<|'" fix (this file's first version) only caught #1:
                      1. "k8s_get_resources<|channel|>json" - literal control tokens
                         leaked verbatim into the name.
                      2. "k8s_get_resourcesjson" - no "<|" substring at all; whatever
                         partial cleanup vLLM/harmony already attempted removed the
                         pipe-delimited token but glued the surrounding text together
                         with no separator, so pattern #1's fix can't find anything to
                         truncate at.
                    Handled by validating against the *actual* tool names from the
                    request (data["tools"][].function.name - present because litellm
                    needs them to make the call) rather than pattern-matching the
                    corruption shape: exact match first, then truncate-at-"<|" (covers
                    #1), then longest-prefix-match against the known valid names
                    (covers #2 and, hopefully, similar future variants - anything
                    where the real name survives intact as a prefix with garbage
                    appended after it). Only handles the non-streaming case
                    (async_post_call_success_hook) - confirmed via LiteLLM_SpendLogs
                    that kagent calls this proxy with stream=false, so that's
                    sufficient here.
                    """

                    from litellm.integrations.custom_logger import CustomLogger


                    def _valid_tool_names(data):
                        names = set()
                        for tool in (data.get("tools") or []):
                            fn = tool.get("function") if isinstance(tool, dict) else None
                            name = fn.get("name") if fn else None
                            if name:
                                names.add(name)
                        return names


                    def _sanitize(name, valid_names):
                        if not name or name in valid_names:
                            return name
                        idx = name.find("<|")
                        candidate = name[:idx] if idx != -1 else name
                        if candidate in valid_names:
                            return candidate
                        best = None
                        for valid in valid_names:
                            if candidate.startswith(valid) and (best is None or len(valid) > len(best)):
                                best = valid
                        return best if best else name


                    class SanitizeHarmonyToolNames(CustomLogger):
                        async def async_post_call_success_hook(
                            self, data, user_api_key_dict, response
                        ):
                            choices = getattr(response, "choices", None)
                            if not choices:
                                return response
                            valid_names = _valid_tool_names(data)
                            for choice in choices:
                                message = getattr(choice, "message", None)
                                tool_calls = getattr(message, "tool_calls", None) if message else None
                                if not tool_calls:
                                    continue
                                for tool_call in tool_calls:
                                    function = getattr(tool_call, "function", None)
                                    if function is None:
                                        continue
                                    clean_name = _sanitize(getattr(function, "name", None), valid_names)
                                    if clean_name != function.name:
                                        function.name = clean_name
                            return response


                    proxy_handler_instance = SanitizeHarmonyToolNames()
              - apiVersion: gateway.networking.k8s.io/v1
                kind: HTTPRoute
                metadata:
                  name: litellm
                  namespace: litellm
                  annotations:
                    k8s-dashboard-group: AI tools
                    k8s-dashboard-appname: LiteLLM  
                spec:
                  parentRefs:
                    - name: "cilium-gw"
                      namespace: "cilium-system"
                  hostnames:
                    - "litellm.{{ domainname }}"
                  rules:
                    - backendRefs:
                        - name: litellm
                          port: 4000
