apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: ollama
  namespace: argocd
  annotations:
    appset-dashboard-appname: "Ollama"
    appset-dashboard-groupname: "AI tools"
    k8s-dashboard-group: "AI tools"
    k8s-dashboard-appname: "Ollama"
spec:
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  ollama: "installed"
          - plugin:
              configMapRef:
                name: argocd-secrets-plugin
              input:
                parameters:
                  secretName: "k8s-clusters-apps-secrets"
  template:
    metadata:
      name: '{{name}}-ollama'
    spec:
      project: k8s-homelab-apps
      sources:
      - helm:
          releaseName: ollama
          values: |
            ollama:
              gpu:
                enabled: false
              models:
                pull:
                  - llama3.2:1b
                  - qwen2.5:1.5b
                run:
                  - llama3.2:1b
                  - qwen2.5:1.5b
            # Keep pulled models loaded well past the chart's 5m default -
            # complexity_router's classifier calls llama3.2:1b/qwen2.5:1.5b on
            # every smart-router request, and a cold reload after an idle
            # gap was a real contributor to classifier timeouts (2026-08-01
            # incident - see docs/09-ollama.md in k8s-ai-homelab).
            extraEnv:
              - name: OLLAMA_KEEP_ALIVE
                value: "30m"
            httpRoute:
              enabled: true
              hostnames:
                - ollama.{{ domainname }}
              parentRefs:
                - name: cilium-gw
                  namespace: cilium-system
            # Bumped from 2Gi/4Gi (request/limit) after a confirmed OOM kill of
            # the llama-server subprocess ("signal: killed") when llama3.2:1b
            # (serving a real answer) and qwen2.5:1.5b (classifying) were both
            # active concurrently - see docs/09-ollama.md incident writeup.
            resources:
              requests:
                memory: 3Gi
                cpu: 1000m
              limits:
                memory: 6Gi
                cpu: 3000m
            # k8s02-worker-02 (the GPU node) is tainted
            # dedicated=gpu-inference:NoSchedule to keep general workloads off
            # it after a real node-hang incident (2026-08-09). Ollama is
            # CPU-only and deliberately kept on this node anyway - it's the
            # most powerful box in the cluster (24 cores vs 4 elsewhere) and
            # ollama benefits from the extra CPU. This toleration is what
            # keeps it schedulable there (verified field placement via
            # `helm template` against the otwld/ollama chart - top-level
            # `tolerations`, not nested under `ollama:`).
            tolerations:
              - key: dedicated
                operator: Equal
                value: gpu-inference
                effect: NoSchedule
        repoURL: https://otwld.github.io/ollama-helm/
        chart: ollama
        targetRevision: 1.70.0
      destination:
        server: '{{server}}' 
        namespace: ollama
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
      