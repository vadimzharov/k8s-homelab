apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: prometheus
  namespace: argocd
  annotations:
    appset-dashboard-appname: "Prometheus"
    appset-dashboard-groupname: "Monitoring"
spec:
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  prometheus: "installed"
          - plugin:
              configMapRef:
                name: argocd-secrets-plugin
              input:
                parameters:
                  secretName: "k8s-clusters-apps-secrets"
  template:
    metadata:
      name: '{{name}}-prometheus'
    spec:
      project: k8s-homelab-apps
      sources:
      - helm:
          releaseName: prometheus
          values: |
            server:
              retention: "14d"
              retentionSize: "50GB"
              extraFlags:
                - storage.tsdb.wal-compression
                - enable-feature=remote-write-receiver
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  cpu: "1"
                  memory: 2Gi
              persistentVolume:
                enabled: true
                size: 50Gi
                storageClass: "freenas-iscsi-csi"
            alertmanager:
              enabled: false
            prometheus-pushgateway:
              enabled: false
        repoURL: https://prometheus-community.github.io/helm-charts
        chart: prometheus
        targetRevision: 26.0.0
      - repoURL: https://github.com/vadimzharov/k8s-homelab.git
        targetRevision: main
        path: manifests-k8s-apps/prometheus-http-routes
      destination:
        server: '{{server}}'
        namespace: prometheus
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
