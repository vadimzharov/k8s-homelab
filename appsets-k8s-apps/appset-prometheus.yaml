apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: prometheus
  namespace: argocd
  annotations:
    appset-dashboard-appname: "Prometheus"
    appset-dashboard-groupname: "Monitoring"
spec:
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  prometheus: "installed"
          - plugin:
              configMapRef:
                name: argocd-secrets-plugin
              input:
                parameters:
                  secretName: "k8s-clusters-apps-secrets"
  template:
    metadata:
      name: '{{name}}-prometheus'
    spec:
      project: k8s-homelab-apps
      sources:
      - helm:
          releaseName: prometheus
          values: |
            # kube-prometheus-stack (prometheus-operator), not the plain
            # prometheus chart - scrape config is now via ServiceMonitor/
            # PodMonitor CRDs discovered cluster-wide (see the
            # SelectorNilUsesHelmValues: false settings below), not
            # pod annotations. Any app that needs to be scraped drops a
            # ServiceMonitor in its own appset (see
            # appset-nvidia-gpu-operator.yaml for the nvidia-dcgm-exporter
            # example) - no coordination with this appset needed.
            # Grafana and Alertmanager are intentionally disabled here -
            # Grafana already runs as its own appset (appset-grafana.yaml),
            # and Alertmanager isn't in use yet (matches the previous
            # chart's alertmanager.enabled: false).
            grafana:
              enabled: false
            alertmanager:
              enabled: false
            prometheus-pushgateway:
              enabled: false
            prometheus:
              prometheusSpec:
                retention: "14d"
                retentionSize: "50GB"
                walCompression: true
                enableRemoteWriteReceiver: true
                serviceMonitorSelectorNilUsesHelmValues: false
                podMonitorSelectorNilUsesHelmValues: false
                probeSelectorNilUsesHelmValues: false
                ruleSelectorNilUsesHelmValues: false
                scrapeConfigSelectorNilUsesHelmValues: false
                resources:
                  requests:
                    cpu: 250m
                    memory: 512Mi
                  limits:
                    cpu: "1"
                    memory: 2Gi
                storageSpec:
                  volumeClaimTemplate:
                    spec:
                      storageClassName: "freenas-iscsi-csi"
                      accessModes: ["ReadWriteOnce"]
                      resources:
                        requests:
                          storage: 50Gi
              route:
                main:
                  enabled: true
                  annotations:
                    k8s-dashboard-group: Monitoring
                    k8s-dashboard-appname: Prometheus
                  parentRefs:
                    - name: cilium-gw
                      namespace: cilium-system
                      sectionName: https-gw
                  hostnames:
                    - "prometheus.{{ domainname }}"
                    - "prometheus-write.{{ domainname }}"
                  additionalRules:
                    - backendRefs:
                        # group/kind/weight spelled out explicitly - the
                        # k8s apiserver defaults these onto every
                        # backendRef on write, and without them here
                        # ArgoCD's rendered manifest never matches the
                        # live object, so this rule shows perpetually
                        # OutOfSync.
                        - group: ""
                          kind: Service
                          name: prometheus-kube-prometheus-prometheus
                          port: 9090
                          weight: 1
                      matches:
                        - path:
                            type: PathPrefix
                            value: /api/v1/write
        repoURL: https://prometheus-community.github.io/helm-charts
        chart: kube-prometheus-stack
        targetRevision: 88.5.2
      destination:
        server: '{{server}}'
        namespace: prometheus
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          # kube-prometheus-stack's CRDs (e.g. crd-prometheuses.yaml,
          # ~830KB) exceed kubectl's 262144-byte client-side-apply
          # annotation limit - without this, the first sync fails.
          - ServerSideApply=true
