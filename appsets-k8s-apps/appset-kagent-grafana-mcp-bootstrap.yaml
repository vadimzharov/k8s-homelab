apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kagent-grafana-mcp-bootstrap
  namespace: argocd
  annotations:
    appset-dashboard-appname: "KAgent Grafana MCP - token bootstrap"
    appset-dashboard-groupname: "AI tools"
spec:
  generators:
    - clusters:
        selector:
          matchLabels:
            kagent: "installed"
            grafana: "installed"
  template:
    metadata:
      name: '{{name}}-kagent-grafana-mcp-bootstrap'
    spec:
      project: k8s-homelab-apps
      sources:
      - helm:
          releaseName: kagent-grafana-mcp-bootstrap
          values: |
            controllers:
              main:
                enabled: false
            rawResources:
              # Mints a Grafana service-account token for kagent-grafana-mcp
              # (see appset-kagent.yaml's grafana-mcp block) with zero manual
              # steps. Grafana's Helm chart has no declarative way to create
              # service accounts/API tokens (that's an app-level Grafana
              # concept, not a k8s object) - and this bundled MCP server
              # can't live outside the kagent namespace (it's a subchart of
              # the kagent release, not independently deployable), so it
              # can't just co-locate with Grafana's own admin Secret either.
              # This Job bridges that gap: reads Grafana's real admin
              # credentials (grafana/grafana Secret, cross-namespace) rather
              # than duplicating them into a second Vault entry, and is
              # idempotent - it only mints a new token if the target Secret
              # doesn't already have one, since Grafana tokens can only be
              # retrieved once at creation time.
              bootstrap-sa:
                apiVersion: v1
                kind: ServiceAccount
                forceRename: "kagent-grafana-mcp-bootstrap"
                spec: {}
              bootstrap-writer-role:
                apiVersion: rbac.authorization.k8s.io/v1
                kind: Role
                forceRename: "kagent-grafana-mcp-bootstrap-writer"
                spec:
                  rules:
                    - apiGroups: [""]
                      resources: ["secrets"]
                      resourceNames: ["kagent-grafana-mcp-sa-token"]
                      verbs: ["get", "update", "patch"]
                    - apiGroups: [""]
                      resources: ["secrets"]
                      verbs: ["create"]
              bootstrap-writer-binding:
                apiVersion: rbac.authorization.k8s.io/v1
                kind: RoleBinding
                forceRename: "kagent-grafana-mcp-bootstrap-writer"
                spec:
                  subjects:
                    - kind: ServiceAccount
                      name: kagent-grafana-mcp-bootstrap
                      namespace: kagent
                  roleRef:
                    apiGroup: rbac.authorization.k8s.io
                    kind: Role
                    name: kagent-grafana-mcp-bootstrap-writer
              # Read access to Grafana's own admin Secret, which lives in
              # the grafana namespace, not kagent. bjw-s app-template's
              # rawResources never sets metadata.namespace on the rendered
              # object (confirmed via its render template), so a namespaced
              # Role/RoleBinding here would always land in this
              # Application's own namespace (kagent), not grafana - hence
              # ClusterRole/ClusterRoleBinding instead (non-namespaced, so
              # this constraint doesn't apply). Scoped as tight as a
              # cluster-scoped grant allows: get only, resourceNames
              # restricts it to secrets literally named "grafana" in any
              # namespace - broader than a namespace-scoped Role would be,
              # but low-risk for a single read-only verb on a specific name.
              bootstrap-reader-role:
                apiVersion: rbac.authorization.k8s.io/v1
                kind: ClusterRole
                forceRename: "kagent-grafana-mcp-bootstrap-reader"
                spec:
                  rules:
                    - apiGroups: [""]
                      resources: ["secrets"]
                      resourceNames: ["grafana"]
                      verbs: ["get"]
              bootstrap-reader-binding:
                apiVersion: rbac.authorization.k8s.io/v1
                kind: ClusterRoleBinding
                forceRename: "kagent-grafana-mcp-bootstrap-reader"
                spec:
                  subjects:
                    - kind: ServiceAccount
                      name: kagent-grafana-mcp-bootstrap
                      namespace: kagent
                  roleRef:
                    apiGroup: rbac.authorization.k8s.io
                    kind: ClusterRole
                    name: kagent-grafana-mcp-bootstrap-reader
              bootstrap-job:
                apiVersion: batch/v1
                kind: Job
                forceRename: "kagent-grafana-mcp-bootstrap"
                annotations:
                  # PreSync (the first attempt) deadlocked the whole
                  # Application: a PreSync hook runs BEFORE the plain
                  # ServiceAccount/RBAC resources above even apply (those
                  # are ordinary Sync-phase resources), but this Job
                  # references that ServiceAccount - it retried pod
                  # creation forever ("serviceaccount ... not found"),
                  # and ArgoCD won't proceed past a stuck PreSync hook to
                  # apply anything else. Confirmed live 2026-08-20. Sync
                  # (not PreSync) + an explicit later sync-wave than the
                  # plain resources' default (0) guarantees the ordering
                  # this Job actually needs, while hook-delete-policy still
                  # gets it deleted+recreated fresh on every sync for the
                  # self-healing behavior this was built for.
                  argocd.argoproj.io/hook: Sync
                  argocd.argoproj.io/sync-wave: "1"
                  argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
                spec:
                  spec:
                    backoffLimit: 3
                    template:
                      spec:
                        serviceAccountName: kagent-grafana-mcp-bootstrap
                        restartPolicy: Never
                        containers:
                          - name: bootstrap
                            image: alpine:3.20
                            command: ["/bin/sh", "-c"]
                            args:
                              - |
                                set -eu
                                apk add --no-cache curl jq >/dev/null

                                API="https://kubernetes.default.svc"
                                TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
                                CACERT=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                                SECRET_NS="kagent"
                                SECRET_NAME="kagent-grafana-mcp-sa-token"
                                GRAFANA_URL="http://grafana.grafana.svc.cluster.local"
                                SA_NAME="kagent-observability-agent"

                                existing=$(curl -sk -H "Authorization: Bearer $TOKEN" --cacert "$CACERT" \
                                  "$API/api/v1/namespaces/$SECRET_NS/secrets/$SECRET_NAME" || true)
                                if echo "$existing" | jq -e '.data.GRAFANA_SERVICE_ACCOUNT_TOKEN' >/dev/null 2>&1; then
                                  echo "token secret already exists, nothing to do"
                                  exit 0
                                fi

                                admin_secret=$(curl -sk -H "Authorization: Bearer $TOKEN" --cacert "$CACERT" \
                                  "$API/api/v1/namespaces/grafana/secrets/grafana")
                                admin_user=$(echo "$admin_secret" | jq -r '.data["admin-user"]' | base64 -d)
                                admin_pass=$(echo "$admin_secret" | jq -r '.data["admin-password"]' | base64 -d)

                                sa_id=$(curl -s -u "$admin_user:$admin_pass" \
                                  "$GRAFANA_URL/api/serviceaccounts/search?query=$SA_NAME" | jq -r '.serviceAccounts[0].id // empty')
                                if [ -z "$sa_id" ]; then
                                  sa_id=$(curl -s -u "$admin_user:$admin_pass" -X POST "$GRAFANA_URL/api/serviceaccounts" \
                                    -H "Content-Type: application/json" \
                                    -d "{\"name\":\"$SA_NAME\",\"role\":\"Viewer\"}" | jq -r '.id')
                                fi

                                grafana_token=$(curl -s -u "$admin_user:$admin_pass" -X POST \
                                  "$GRAFANA_URL/api/serviceaccounts/$sa_id/tokens" \
                                  -H "Content-Type: application/json" \
                                  -d '{"name":"kagent-mcp-token"}' | jq -r '.key')

                                if [ -z "$grafana_token" ] || [ "$grafana_token" = "null" ]; then
                                  echo "failed to obtain a grafana service-account token" >&2
                                  exit 1
                                fi

                                token_b64=$(printf '%s' "$grafana_token" | base64 | tr -d '\n')

                                curl -sk -X POST -H "Authorization: Bearer $TOKEN" --cacert "$CACERT" \
                                  -H "Content-Type: application/json" \
                                  "$API/api/v1/namespaces/$SECRET_NS/secrets" \
                                  -d "{\"apiVersion\":\"v1\",\"kind\":\"Secret\",\"metadata\":{\"name\":\"$SECRET_NAME\"},\"type\":\"Opaque\",\"data\":{\"GRAFANA_SERVICE_ACCOUNT_TOKEN\":\"$token_b64\"}}"

                                echo "created secret $SECRET_NAME"
        repoURL: https://bjw-s-labs.github.io/helm-charts
        chart: app-template
        targetRevision: 4.6.2
      destination:
        server: '{{server}}'
        namespace: kagent
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
